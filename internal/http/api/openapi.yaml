openapi: 3.0.3
info:
  title: MeshSDR hub API
  version: "1"
  description: |
    JSON API of the MeshSDR hub (TECHNICAL_SPEC §6.10, ADR 0023): only
    what scripts, islands, nodes and operations need. UI actions are HTML
    forms on page-scoped paths, with no API twin. Every endpoint is
    declared here first, then the Go server interface is generated with
    oapi-codegen. Errors use one format: RFC 9457 problem details with a
    stable `code`.

    Every operation declares its required role in `x-meshsdr-access`
    (`anonymous`, `listener`, `operator` or `admin`): the server-side policy
    table (SR-15). A role implies the roles below it; `admin` operations are
    also restricted to `admin.allowed_networks`.

    State-changing requests (POST, PUT, PATCH, DELETE) need the
    `X-CSRF-Token` header from `GET /auth/session` and pass the browser
    cross-origin check; request bodies must be `application/json`.
servers:
  - url: /api/v1
paths:
  /openapi.json:
    get:
      operationId: getOpenAPI
      x-meshsdr-access: anonymous
      summary: This OpenAPI document, as JSON
      tags: [meta]
      responses:
        "200":
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
  /healthz/live:
    get:
      operationId: getLiveness
      x-meshsdr-access: anonymous
      summary: Liveness (no details)
      tags: [health]
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /healthz/ready:
    get:
      operationId: getReadiness
      x-meshsdr-access: anonymous
      summary: Readiness (ok or degraded, no internals)
      tags: [health]
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getSession
      x-meshsdr-access: anonymous
      summary: Current identity, roles, CSRF token and auth providers
      description: |
        Returns the caller's identity and the CSRF token to send in
        `X-CSRF-Token` on state-changing requests. Without a session, the
        token is bound to a pre-session cookie set by this response
        (login and other anonymous forms).
      tags: [auth]
      responses:
        "200":
          description: Current session (or anonymous)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /features:
    get:
      operationId: getFeatures
      x-meshsdr-access: anonymous
      summary: Public feature summary (API-001)
      description: |
        The enabled devices the caller may listen to (effective listen
        policy: the device's node config override, else the global
        `listen_policy`), each with the modes its node reports available.
        It never carries node addresses, versions or missing requirements:
        the detailed report is on the Admin › Nodes pages (operators).
      tags: [grid]
      responses:
        "200":
          description: Feature summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
        default:
          $ref: "#/components/responses/Problem"
  /config/effective:
    get:
      operationId: getEffectiveConfig
      x-meshsdr-access: admin
      summary: Effective configuration with sources, secrets masked (ADM-010)
      tags: [settings]
      parameters:
        - name: download
          in: query
          description: Send the document as an attachment.
          schema:
            type: boolean
      responses:
        "200":
          description: Every config key and setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        default:
          $ref: "#/components/responses/Problem"
  /branding/{slot}:
    parameters:
      - name: slot
        in: path
        required: true
        schema:
          type: string
          enum: [avatar, panorama]
    get:
      operationId: getReceiverImage
      x-meshsdr-access: anonymous
      summary: The receiver avatar or panorama (ADM-004)
      tags: [branding]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The image, as stored after re-encoding
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match)
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/token:
    post:
      operationId: mintAccessToken
      x-meshsdr-access: anonymous
      summary: Get an access token for a node media connection
      description: |
        Issues a short-lived EdDSA token (`auth.token_ttl`, 5 minutes by
        default) for one node and one media connection, scoped to the node's
        devices the caller may listen to (TECHNICAL_SPEC §5.8). The client
        refreshes it in band before it expires. Derived from the live
        session: a revoked session or a changed role stops refreshes.
        Anonymous callers need a connection bound by the gateway (GRID-011);
        until then they get 401. Limited to 30 per minute per session.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The token. Never store it beyond the page's memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /presets:
    get:
      operationId: listPresets
      x-meshsdr-access: admin
      summary: List the presets, by sort order (admin)
      description: |
        Presets are device-independent hub data (TECHNICAL_SPEC §7.1). With
        `device_id`, only the presets that fit that device's reported
        frequency range and sample rates are listed (422 `unknown_device`
        for a device the registry lacks).
      tags: [presets]
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPreset
      x-meshsdr-access: admin
      summary: Create a preset (admin)
      description: |
        Field syntax is checked here (422 `invalid_preset` with one error per
        field); compatibility with a device is checked when the preset is
        applied. Without `slug`, one is derived from the name. Audited.
      tags: [presets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetInput"
      responses:
        "201":
          description: Created preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        default:
          $ref: "#/components/responses/Problem"
  /presets/{id}:
    parameters:
      - $ref: "#/components/parameters/PresetID"
    get:
      operationId: getPreset
      x-meshsdr-access: admin
      summary: One preset (admin)
      tags: [presets]
      responses:
        "200":
          description: Preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replacePreset
      x-meshsdr-access: admin
      summary: Replace a preset (admin)
      description: |
        Carries the expected `version` (409 `version_conflict`). The enabled
        schedules the new definition no longer fits are disabled with the
        reason `preset_incompatible` and listed in `disabled_schedules`
        (ADR 0020). Audited.
      tags: [presets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetReplace"
      responses:
        "200":
          description: Replaced preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetUpdate"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePreset
      x-meshsdr-access: admin
      summary: Delete a preset (admin; 409 preset_in_use while schedules reference it)
      description: |
        Deleting a preset never retunes a device: a device on which it is
        active keeps its tuning (ADM-020). Audited.
      tags: [presets]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /schedules:
    get:
      operationId: listSchedules
      x-meshsdr-access: listener
      summary: List the schedules (admins; operators see those of the devices they operate)
      description: |
        Read-only for operators, who see the schedules of the devices they
        hold the operator role on (globally or per device); other users get
        an empty list. A schedule the hub disabled carries
        `disabled_reason` (GRID-016).
      tags: [schedules]
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSchedule
      x-meshsdr-access: admin
      summary: Create a schedule (admin)
      description: |
        A static UTC window `(start_minute, end_minute)`; `end_minute` before
        `start_minute` wraps over midnight. Daylight windows answer 422
        `schedule_kind_unsupported` (SVC-011). The device must be in the
        registry (422 `unknown_device`) and the preset must exist (422
        `unknown_preset`); an enabled schedule also needs a device its node
        still reports (422 `device_unavailable`) and a preset that fits it
        (422 `preset_incompatible`). Overlapping windows are resolved by
        `priority`. Audited.
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
  /schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    get:
      operationId: getSchedule
      x-meshsdr-access: listener
      summary: One schedule (admins; operators of its device)
      tags: [schedules]
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceSchedule
      x-meshsdr-access: admin
      summary: Replace a schedule (admin)
      description: |
        Carries the expected `version` (409 `version_conflict`). Enabling a
        schedule the hub disabled clears its `disabled_reason` and checks it
        again like a creation. Audited.
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleReplace"
      responses:
        "200":
          description: Replaced schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSchedule
      x-meshsdr-access: admin
      summary: Delete a schedule (admin)
      tags: [schedules]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    PresetID:
      name: id
      in: path
      required: true
      description: Preset id (UUID).
      schema:
        type: string
        maxLength: 36
    ScheduleID:
      name: id
      in: path
      required: true
      description: Schedule id (UUID).
      schema:
        type: string
        maxLength: 36
  schemas:
    TokenRequest:
      type: object
      additionalProperties: false
      required: [node_id, cid]
      properties:
        node_id:
          type: string
          maxLength: 64
        cid:
          type: string
          description: Media connection id issued by the hub.
          maxLength: 64
    AccessToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    Features:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceFeatures"
    DeviceFeatures:
      type: object
      additionalProperties: false
      required: [id, node_id, name, online, modes]
      properties:
        id:
          type: string
        node_id:
          type: string
        name:
          type: string
        online:
          type: boolean
        modes:
          type: array
          description: Modes the device's node reports available, sorted.
          items:
            type: string
    SessionInfo:
      type: object
      required: [authenticated, roles, csrf_token, providers]
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/SessionUser"
        roles:
          type: array
          description: Roles held globally or on some device, lowest first. Empty when anonymous.
          items:
            type: string
            enum: [listener, operator, admin]
        csrf_token:
          type: string
          description: Value of the X-CSRF-Token header for state-changing requests.
        providers:
          type: array
          description: Available auth providers (`local` only in v1).
          items:
            type: string
    SessionUser:
      type: object
      required: [id, username, must_change_password]
      properties:
        id:
          type: string
          description: User id (UUID).
          example: 0192c3a4-5b6c-7d8e-9f01-23456789abcd
        username:
          type: string
        display_name:
          type: string
        must_change_password:
          type: boolean
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    Problem:
      description: RFC 9457 problem details, served as application/problem+json.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Always "about:blank"; the error is identified by `code`.
          example: about:blank
        title:
          type: string
          description: Short summary of the HTTP status.
          example: Not Found
        status:
          type: integer
          example: 404
        code:
          type: string
          description: Stable snake_case error code.
          example: not_found
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        errors:
          type: array
          description: Field errors of an invalid request.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          example: username
        code:
          type: string
          example: required
        message:
          type: string
    EffectiveConfig:
      type: object
      required: [generated_at, revision, entries]
      properties:
        generated_at:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ConfigEntry"
    ConfigEntry:
      type: object
      required: [key, class, source, origin, locked, secret]
      properties:
        key:
          type: string
          description: Dotted key; settings keys keep their hub.toml name (settings.…).
        class:
          type: string
          enum: [cfg, db]
          description: cfg for config-only keys, db for settings (lockable).
        value:
          description: Effective value. Absent for secrets.
          nullable: true
          x-go-type-skip-optional-pointer: true
        set:
          type: boolean
          description: Secrets only.
        source:
          type: string
          enum: [cfg, db, default]
        origin:
          type: string
        locked:
          type: boolean
        secret:
          type: boolean
    PresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preset"
    WaterfallLevels:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          description: dB, -200 to 50, below max.
        max:
          type: integer
          description: dB, -200 to 50.
    Preset:
      type: object
      required: [id, slug, name, tags, center_freq, samp_rate, start_freq, start_mod, tuning_step, sort_order, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: 2m-aprs
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        center_freq:
          type: integer
          format: int64
          description: Hz
        samp_rate:
          type: integer
          format: int64
          description: S/s
        start_freq:
          type: integer
          format: int64
          description: Initial listener frequency, Hz, within half the sample rate of the centre.
        start_mod:
          type: string
          description: Initial mode id.
        tuning_step:
          type: integer
          format: int64
          description: Hz
        initial_squelch_level:
          type: integer
          description: dBFS
        initial_nr_level:
          type: integer
          description: dB, -20 to 20
        waterfall_levels:
          $ref: "#/components/schemas/WaterfallLevels"
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    PresetInput:
      type: object
      additionalProperties: false
      required: [name, center_freq, samp_rate]
      properties:
        slug:
          type: string
          description: Unique URL handle; derived from the name when absent.
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        center_freq:
          type: integer
          format: int64
        samp_rate:
          type: integer
          format: int64
        start_freq:
          type: integer
          format: int64
          description: Defaults to the centre frequency.
        start_mod:
          type: string
          description: Defaults to nfm.
        tuning_step:
          type: integer
          format: int64
          description: Defaults to 1000 Hz.
        initial_squelch_level:
          type: integer
        initial_nr_level:
          type: integer
        waterfall_levels:
          $ref: "#/components/schemas/WaterfallLevels"
    PresetReplace:
      type: object
      additionalProperties: false
      required: [version, name, center_freq, samp_rate]
      properties:
        version:
          type: integer
          description: Expected version (optimistic concurrency, 409 version_conflict on mismatch).
        slug:
          type: string
          description: Unique URL handle; kept when absent.
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        center_freq:
          type: integer
          format: int64
        samp_rate:
          type: integer
          format: int64
        start_freq:
          type: integer
          format: int64
        start_mod:
          type: string
        tuning_step:
          type: integer
          format: int64
        initial_squelch_level:
          type: integer
        initial_nr_level:
          type: integer
        waterfall_levels:
          $ref: "#/components/schemas/WaterfallLevels"
    PresetUpdate:
      type: object
      required: [preset, disabled_schedules]
      properties:
        preset:
          $ref: "#/components/schemas/Preset"
        disabled_schedules:
          type: array
          description: Schedules disabled because the preset no longer fits their device.
          items:
            type: string
            format: uuid
    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
    Schedule:
      type: object
      required: [id, device_id, preset_id, kind, days_of_week, priority, enabled, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
        preset_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [static, daylight]
        start_minute:
          type: integer
          description: Minute of the UTC day, 0 to 1439 (static).
        end_minute:
          type: integer
          description: Minute of the UTC day; before start_minute wraps over midnight (static).
        days_of_week:
          type: integer
          description: Bitmask of the days a window starts on, Monday = 1 … Sunday = 64.
        daylight_phase:
          type: string
          enum: [day, night, greyline]
        priority:
          type: integer
          description: The highest priority wins on overlapping windows.
        enabled:
          type: boolean
        disabled_reason:
          type: string
          enum: [device_stale, device_removed, preset_incompatible]
          description: Set when the hub disabled the schedule; an admin re-enables it.
        disabled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    ScheduleInput:
      type: object
      additionalProperties: false
      required: [device_id, preset_id]
      properties:
        device_id:
          type: string
        preset_id:
          type: string
        kind:
          type: string
          enum: [static, daylight]
          description: Defaults to static. Daylight is not supported yet (422 schedule_kind_unsupported).
        start_minute:
          type: integer
        end_minute:
          type: integer
        days_of_week:
          type: integer
          description: Defaults to 127 (every day).
        daylight_phase:
          type: string
          enum: [day, night, greyline]
        priority:
          type: integer
          description: Defaults to 0.
        enabled:
          type: boolean
          description: Defaults to true.
    ScheduleReplace:
      type: object
      additionalProperties: false
      required: [version, device_id, preset_id]
      properties:
        version:
          type: integer
          description: Expected version (optimistic concurrency, 409 version_conflict on mismatch).
        device_id:
          type: string
        preset_id:
          type: string
        kind:
          type: string
          enum: [static, daylight]
        start_minute:
          type: integer
        end_minute:
          type: integer
        days_of_week:
          type: integer
        daylight_phase:
          type: string
          enum: [day, night, greyline]
        priority:
          type: integer
        enabled:
          type: boolean
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
