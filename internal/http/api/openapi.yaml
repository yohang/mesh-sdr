openapi: 3.0.3
info:
  title: MeshSDR hub API
  version: "1"
  description: |
    JSON API of the MeshSDR hub (TECHNICAL_SPEC §6.10, ADR 0023): only
    what scripts, islands, nodes and operations need. UI actions are HTML
    forms on page-scoped paths, with no API twin. Every endpoint is
    declared here first, then the Go server interface is generated with
    oapi-codegen. Errors use one format: RFC 9457 problem details with a
    stable `code`.

    Every operation declares its required role in `x-meshsdr-access`
    (`anonymous`, `listener`, `operator` or `admin`): the server-side policy
    table (SR-15). A role implies the roles below it; `admin` operations are
    also restricted to `admin.allowed_networks`.

    State-changing requests (POST, PUT, PATCH, DELETE) need the
    `X-CSRF-Token` header from `GET /auth/session` and pass the browser
    cross-origin check; request bodies must be `application/json`.
servers:
  - url: /api/v1
paths:
  /openapi.json:
    get:
      operationId: getOpenAPI
      x-meshsdr-access: anonymous
      summary: This OpenAPI document, as JSON
      tags: [meta]
      responses:
        "200":
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
  /healthz/live:
    get:
      operationId: getLiveness
      x-meshsdr-access: anonymous
      summary: Liveness (no details)
      tags: [health]
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /healthz/ready:
    get:
      operationId: getReadiness
      x-meshsdr-access: anonymous
      summary: Readiness (ok or degraded, no internals)
      tags: [health]
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getSession
      x-meshsdr-access: anonymous
      summary: Current identity, roles, CSRF token and auth providers
      description: |
        Returns the caller's identity and the CSRF token to send in
        `X-CSRF-Token` on state-changing requests. Without a session, the
        token is bound to a pre-session cookie set by this response
        (login and other anonymous forms).
      tags: [auth]
      responses:
        "200":
          description: Current session (or anonymous)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /features:
    get:
      operationId: getFeatures
      x-meshsdr-access: anonymous
      summary: Public feature summary (API-001)
      description: |
        The enabled devices the caller may listen to (effective listen
        policy: the device's node config override, else the global
        `listen_policy`), each with the modes its node reports available,
        its state, its active preset and its listener count (UI-021), and
        the nodes of those devices with their last public telemetry while
        online (RX-035: CPU and temperature, the §6.6 public subset). It never carries node
        addresses, versions or missing requirements: the detailed report is
        on the Admin › Nodes pages (operators).
      tags: [grid]
      responses:
        "200":
          description: Feature summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
        default:
          $ref: "#/components/responses/Problem"
  /status:
    get:
      operationId: getStatus
      x-meshsdr-access: anonymous
      summary: Public station status (API-003)
      description: |
        Station name, location, global position, version, and a summary of
        every enabled device across the nodes: name, type family, the
        active preset with its centre frequency and sample rate, listener
        count and online state. The administrator e-mail is present only
        when `receiver.admin_email_public` is true. It never carries node
        addresses or client addresses. Also served at `/status.json` (an
        alias for receiver directory sites, same body, outside `/api/v1`).
      tags: [meta]
      responses:
        "200":
          description: Station status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Problem"
  /config/effective:
    get:
      operationId: getEffectiveConfig
      x-meshsdr-access: admin
      summary: Effective configuration with sources, secrets masked (ADM-010)
      tags: [settings]
      parameters:
        - name: download
          in: query
          description: Send the document as an attachment.
          schema:
            type: boolean
      responses:
        "200":
          description: Every config key and setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        default:
          $ref: "#/components/responses/Problem"
  /branding/{slot}:
    parameters:
      - name: slot
        in: path
        required: true
        schema:
          type: string
          enum: [avatar, panorama]
    get:
      operationId: getReceiverImage
      x-meshsdr-access: anonymous
      summary: The receiver avatar or panorama (ADM-004)
      tags: [branding]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The image, as stored after re-encoding
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match)
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/token:
    post:
      operationId: mintAccessToken
      x-meshsdr-access: anonymous
      summary: Get an access token for a node media connection
      description: |
        Issues a short-lived EdDSA token (`auth.token_ttl`, 5 minutes by
        default) for one node and one media connection, scoped to the node's
        devices the caller may listen to (TECHNICAL_SPEC §5.8). The client
        refreshes it in band before it expires. Derived from the live
        session: a revoked session or a changed role stops refreshes.
        Anonymous callers need a connection bound by the gateway (GRID-011);
        until then they get 401. Limited to 30 per minute per session.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The token. Never store it beyond the page's memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /bookmarks:
    get:
      operationId: getBookmarks
      x-meshsdr-access: anonymous
      summary: Bookmarks of a device in a frequency range (BMK-001, ADM-022)
      description: |
        The bookmarks shown on a device: the general pack, the pack of the
        current `bandplan.region`, and the hub bookmarks whose scope is all
        devices, this device, or the preset the device runs (BMK-008).
        Sorted by frequency; on the same frequency hub bookmarks (origin
        `db`) come before pack bookmarks (origin `builtin`, read-only),
        then by name (BMK-007). A device that does not exist, is disabled
        or that the caller may not listen to (its effective listen policy)
        answers 404 `device_not_found`. Hub bookmarks are created, edited
        and deleted on the Bookmarks › Manage pages (ADR 0023).
      tags: [bookmarks]
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/FromHz"
        - $ref: "#/components/parameters/ToHz"
      responses:
        "200":
          description: Bookmarks in the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmarks"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /bandplan:
    get:
      operationId: getBandplan
      x-meshsdr-access: anonymous
      summary: Bands and dial frequencies of the current region (RX-029, RX-030)
      description: |
        The bands of the band plan of `bandplan.region` that overlap the
        range, by lower bound, and the dial frequencies in the range, by
        frequency. A band's `tags` are its colour key (hamradio, broadcast,
        public, service).
      tags: [bookmarks]
      parameters:
        - $ref: "#/components/parameters/FromHz"
        - $ref: "#/components/parameters/ToHz"
      responses:
        "200":
          description: Band plan in the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bandplan"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /files/{id}/content:
    parameters:
      - $ref: "#/components/parameters/FileID"
    get:
      operationId: getFileContent
      x-meshsdr-access: anonymous
      summary: The content of a file the nodes sent (FIL-002)
      description: |
        The stored content of a complete file (an SSTV or FAX image, a text
        log), with its stored, validated type, as an attachment named by the
        hub. Who may read it follows the listen policy (ADR 0026): signed-in
        users read every file, visitors those of the devices they may
        listen to, none under the registered policy. A file the caller may
        not read is not found.
      tags: [files]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The content
          headers:
            ETag:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "304":
          description: Not modified (If-None-Match)
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /files/{id}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/FileID"
    get:
      operationId: getFileThumbnail
      x-meshsdr-access: anonymous
      summary: The thumbnail of an image file (FIL-001)
      description: |
        A JPEG of at most 320 pixels per side, made by the hub when the
        image arrived. Same rights as the content.
      tags: [files]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The thumbnail
          headers:
            ETag:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match)
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /map/features:
    get:
      operationId: getMapFeatures
      x-meshsdr-access: anonymous
      summary: Current map features (MAP-002)
      description: |
        The features on the map that are not expired: APRS stations and
        objects, WSJT and JS8 locators, call lines. A feature belongs to
        the device that reported it last; the caller gets the features of
        the enabled devices they may listen to (effective listen policy),
        and nothing else. The map island loads them once, then follows the
        `map.feature.upsert` and `map.feature.remove` events of the `map`
        topic of `/api/ws`, and loads them again after a reconnection.
        Times are Unix milliseconds. Every text value is untrusted radio
        data: plain text, to be inserted as text, never as HTML.
      tags: [map]
      responses:
        "200":
          description: Map features
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapFeatures"
        default:
          $ref: "#/components/responses/Problem"
  /map/config:
    get:
      operationId: getMapConfig
      x-meshsdr-access: anonymous
      summary: Map configuration (MAP-004, MAP-007, MAP-011, MAP-012, MAP-015)
      description: |
        What the map island needs besides the features: the offered base
        layers (keyless tile URLs the browser loads directly) and the
        default one, the lifetimes of positions and call lines, the most
        call lines shown, the lookup link templates (one `{}` placeholder,
        to be replaced by the URL-encoded value), and the receivers: one
        marker per node position, per device with a position of its own,
        and the station position (`receiver.gps`) for the devices of nodes
        without a position. Receivers list only the devices the caller may
        listen to; unless `map.precise_receivers` is set, their position is
        the centre of their 4-character locator (SR-32). It never carries an
        API key.
      tags: [map]
      responses:
        "200":
          description: Map configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapConfig"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    FileID:
      name: id
      in: path
      required: true
      description: File id (UUID).
      schema:
        type: string
        maxLength: 36
    FromHz:
      name: from
      in: query
      description: Lowest frequency, in Hz (default 0).
      schema:
        type: integer
        format: int64
        minimum: 0
    ToHz:
      name: to
      in: query
      description: Highest frequency, in Hz (default no limit).
      schema:
        type: integer
        format: int64
        minimum: 0
  schemas:
    Bookmarks:
      type: object
      additionalProperties: false
      required: [region, bookmarks]
      properties:
        region:
          type: string
          enum: [r1, r2, r3]
          description: Region of the pack bookmarks (bandplan.region).
        bookmarks:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"
    Bookmark:
      type: object
      additionalProperties: false
      required: [id, name, frequency, modulation, scannable, origin, tags, scope]
      properties:
        id:
          type: string
          description: Stable UUID.
        name:
          type: string
          description: Plain text.
        frequency:
          type: integer
          format: int64
          description: Hz.
        modulation:
          type: string
          description: Mode id (am, nfm, usb…; digital modes of the packs are kept as is).
        underlying:
          type: string
          description: Underlying analog mode of a digital mode.
        description:
          type: string
          description: Plain text.
        scannable:
          type: boolean
        origin:
          type: string
          enum: [config, db, import, builtin]
          description: builtin = pack bookmark (read-only), db = hub bookmark.
        tags:
          type: array
          description: pack:<name> and region:<r> tags of the pack bookmarks.
          items:
            type: string
        scope:
          $ref: "#/components/schemas/BookmarkScope"
    BookmarkScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [all, device, preset]
        device_id:
          type: string
        preset_id:
          type: string
    Bandplan:
      type: object
      additionalProperties: false
      required: [region, bands, dials]
      properties:
        region:
          type: string
          enum: [r1, r2, r3]
        bands:
          type: array
          items:
            $ref: "#/components/schemas/Band"
        dials:
          type: array
          items:
            $ref: "#/components/schemas/Dial"
    Band:
      type: object
      additionalProperties: false
      required: [name, low, high, tags]
      properties:
        name:
          type: string
        low:
          type: integer
          format: int64
          description: Lower bound, Hz.
        high:
          type: integer
          format: int64
          description: Upper bound, Hz.
        tags:
          type: array
          items:
            type: string
    Dial:
      type: object
      additionalProperties: false
      required: [mode, frequency, band]
      properties:
        mode:
          type: string
        frequency:
          type: integer
          format: int64
        underlying:
          type: string
        band:
          type: string
          description: Name of the band the dial belongs to.
    TokenRequest:
      type: object
      additionalProperties: false
      required: [node_id, cid]
      properties:
        node_id:
          type: string
          maxLength: 64
        cid:
          type: string
          description: Media connection id issued by the hub.
          maxLength: 64
    AccessToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    Features:
      type: object
      additionalProperties: false
      required: [devices, nodes]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceFeatures"
        nodes:
          type: array
          description: The nodes of the listed devices, in order of first appearance.
          items:
            $ref: "#/components/schemas/NodeFeatures"
    Status:
      type: object
      additionalProperties: false
      required: [name, version, device_count, devices]
      properties:
        name:
          type: string
          description: Station name (`receiver.name`).
        location:
          type: string
          description: Station location, free text (`receiver.location`); absent when unset.
        position:
          $ref: "#/components/schemas/StatusPosition"
        altitude:
          type: integer
          description: Antenna altitude in metres (`receiver.altitude_m`); absent until set.
        version:
          type: string
          description: Hub version.
        admin_email:
          type: string
          description: Contact e-mail; present only when `receiver.admin_email_public` is true and an e-mail is set.
        device_count:
          type: integer
          description: Number of devices listed in `devices`.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/StatusDevice"
    StatusPosition:
      type: object
      additionalProperties: false
      required: [lat, lon]
      description: |
        Station position (`receiver.gps`) in decimal degrees (WGS 84);
        absent when unset. Unless `map.precise_receivers` is set, it is the
        centre of its 4-character Maidenhead locator, like the receivers of
        `GET /map/config` (SR-32).
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    StatusDevice:
      type: object
      additionalProperties: false
      required: [id, name, type, online, listeners]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          description: Device type family (the driver, for example `rtlsdr`).
        online:
          type: boolean
          description: The device's node is connected and the device can run (ready or busy).
        listeners:
          type: integer
          description: Open listener connections on the device.
        preset:
          $ref: "#/components/schemas/StatusPreset"
    StatusPreset:
      type: object
      additionalProperties: false
      required: [name, center_freq, samp_rate]
      description: Active preset of the device; absent when none.
      properties:
        name:
          type: string
        center_freq:
          type: integer
          format: int64
          description: Centre frequency in Hz.
        samp_rate:
          type: integer
          format: int64
          description: Sample rate in S/s.
    DeviceFeatures:
      type: object
      additionalProperties: false
      required: [id, node_id, name, online, node_online, state, modes, login_required, listeners]
      properties:
        id:
          type: string
        node_id:
          type: string
        name:
          type: string
        online:
          type: boolean
          description: The device runs; an idle device only runs while someone listens.
        node_online:
          type: boolean
          description: The device's node has its control channel to the hub up.
        state:
          type: string
          description: Runtime state of the device in the registry (SRC-025).
          enum: [unavailable, disabled, stopped, starting, running, retuning, stopping, retry_wait, failed]
        modes:
          type: array
          description: Modes the device's node reports available, sorted.
          items:
            type: string
        login_required:
          type: boolean
          description: Listening needs a signed-in account (the device's effective listen policy is registered, SRC-023).
        listeners:
          type: integer
          minimum: 0
          description: Open media connections attached to the device (connections registry).
        active_preset:
          $ref: "#/components/schemas/PresetRef"
    PresetRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          description: Empty when the hub does not know the preset.
    NodeFeatures:
      type: object
      additionalProperties: false
      required: [id, name, online]
      properties:
        id:
          type: string
        name:
          type: string
        online:
          type: boolean
          description: The node has its control channel to the hub up.
        cpu:
          type: number
          format: double
          description: CPU busy ratio (0 to 1) of the last heartbeat; absent while offline.
        temp_c:
          type: number
          format: double
          description: Temperature (°C) of the last heartbeat, when the node reports one.
    SessionInfo:
      type: object
      required: [authenticated, roles, csrf_token, providers]
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/SessionUser"
        roles:
          type: array
          description: Roles held globally or on some device, lowest first. Empty when anonymous.
          items:
            type: string
            enum: [listener, operator, admin]
        csrf_token:
          type: string
          description: Value of the X-CSRF-Token header for state-changing requests.
        providers:
          type: array
          description: Available auth providers (`local` only in v1).
          items:
            type: string
    SessionUser:
      type: object
      required: [id, username, must_change_password]
      properties:
        id:
          type: string
          description: User id (UUID).
          example: 0192c3a4-5b6c-7d8e-9f01-23456789abcd
        username:
          type: string
        display_name:
          type: string
        must_change_password:
          type: boolean
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    Problem:
      description: RFC 9457 problem details, served as application/problem+json.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Always "about:blank"; the error is identified by `code`.
          example: about:blank
        title:
          type: string
          description: Short summary of the HTTP status.
          example: Not Found
        status:
          type: integer
          example: 404
        code:
          type: string
          description: Stable snake_case error code.
          example: not_found
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        errors:
          type: array
          description: Field errors of an invalid request.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          example: username
        code:
          type: string
          example: required
        message:
          type: string
    EffectiveConfig:
      type: object
      required: [generated_at, revision, entries]
      properties:
        generated_at:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ConfigEntry"
    ConfigEntry:
      type: object
      required: [key, class, source, origin, locked, secret]
      properties:
        key:
          type: string
          description: Dotted key; settings keys keep their hub.toml name (settings.…).
        class:
          type: string
          enum: [cfg, db]
          description: cfg for config-only keys, db for settings (lockable).
        value:
          description: Effective value. Absent for secrets.
          nullable: true
          x-go-type-skip-optional-pointer: true
        set:
          type: boolean
          description: Secrets only.
        source:
          type: string
          enum: [cfg, db, default]
        origin:
          type: string
        locked:
          type: boolean
        secret:
          type: boolean
    MapFeatures:
      type: object
      additionalProperties: false
      required: [features]
      properties:
        features:
          type: array
          items:
            $ref: "#/components/schemas/MapFeature"
    MapFeature:
      type: object
      additionalProperties: false
      required: [key, kind, source, geometry, details, updated_at]
      description: The map.feature.upsert payload of `/api/ws` has the same shape.
      properties:
        key:
          type: string
          description: Natural key `<kind>:<subject>` (aprs:F4ABC-9, locator:DL1ABC, call:DL1ABC>F4ABC).
        kind:
          type: string
          enum: [aircraft, vessel, aprs, sonde, meshtastic, lora, locator, call, station, repeater, receiver, static, node, other]
        source:
          type: string
          enum: [decode, mqtt, web_cache, config, gps]
        device_id:
          type: string
          description: The device that reported the feature last.
        lat:
          type: number
          format: double
          description: Position (centre of a locator square); absent for call lines.
        lon:
          type: number
          format: double
        geometry:
          type: object
          description: |
            `{type: "point", lat, lon, track?: [{lat, lon}]}` (the previous
            positions of a moving station, oldest first, at most 100),
            `{type: "locator", locator}` or `{type: "line", from, to}` with
            `from` and `to` as `{lat, lon, callsign, locator}`.
          x-go-type: json.RawMessage
        details:
          type: object
          description: Plain-text attributes by kind (label, mode, freq_hz, callsign, locator, symbol, comment, course, speed_kmh, altitude_m, hops, weather…).
          x-go-type: json.RawMessage
        updated_at:
          type: integer
          format: int64
          description: Time of the last report, Unix milliseconds.
        expires_at:
          type: integer
          format: int64
          description: Absolute expiry, Unix milliseconds; absent for a permanent feature.
    MapConfig:
      type: object
      additionalProperties: false
      required: [station_name, base_layers, default_base_layer, position_retention_s, max_calls, call_retention_s, links, receivers]
      properties:
        station_name:
          type: string
        base_layers:
          type: array
          items:
            $ref: "#/components/schemas/MapLayer"
        default_base_layer:
          type: string
          description: Id of the base layer the map opens with.
        position_retention_s:
          type: integer
          description: Default lifetime of positions and locators, seconds.
        max_calls:
          type: integer
          description: Most call lines kept.
        call_retention_s:
          type: integer
          description: Lifetime of call lines, seconds.
        links:
          $ref: "#/components/schemas/MapLinks"
        receivers:
          type: array
          items:
            $ref: "#/components/schemas/MapReceiver"
    MapLayer:
      type: object
      additionalProperties: false
      required: [id, name, url, attribution, max_zoom]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          description: Tile URL template ({z}, {x}, {y}, {s} for a subdomain, {r} for the retina suffix).
        subdomains:
          type: string
          description: Subdomain letters of {s}.
        attribution:
          type: string
          description: Plain-text attribution.
        max_zoom:
          type: integer
    MapLinks:
      type: object
      additionalProperties: false
      description: Lookup link templates with one `{}` placeholder; absent when disabled.
      properties:
        callsign_url:
          type: string
        vessel_url:
          type: string
        flight_url:
          type: string
        modes_url:
          type: string
        sonde_url:
          type: string
    MapReceiver:
      type: object
      additionalProperties: false
      required: [key, kind, name, lat, lon, locator, precise, devices]
      properties:
        key:
          type: string
          description: receiver:node:<id>, receiver:device:<id> or receiver:station.
        kind:
          type: string
          enum: [node, device, station]
        name:
          type: string
          description: The node, device or station name.
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        locator:
          type: string
          description: 4-character locator, or 6 when precise.
        precise:
          type: boolean
          description: False when the position is the centre of the locator.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/MapReceiverDevice"
    MapReceiverDevice:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
