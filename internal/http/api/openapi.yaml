openapi: 3.0.3
info:
  title: MeshSDR hub API
  version: "1"
  description: |
    REST API of the MeshSDR hub (TECHNICAL_SPEC §6.10). Every endpoint is
    declared here first, then the Go server interface is generated with
    oapi-codegen. Errors use one format: RFC 9457 problem details with a
    stable `code`.

    Every operation declares its required role in `x-meshsdr-access`
    (`anonymous`, `listener`, `operator` or `admin`): the server-side policy
    table (SR-15). A role implies the roles below it; `admin` operations are
    also restricted to `admin.allowed_networks`.

    State-changing requests (POST, PUT, PATCH, DELETE) need the
    `X-CSRF-Token` header from `GET /auth/session` and pass the browser
    cross-origin check; request bodies must be `application/json`, except
    for operations whose request body is declared `multipart/form-data`
    (uploads).
servers:
  - url: /api/v1
paths:
  /openapi.json:
    get:
      operationId: getOpenAPI
      x-meshsdr-access: anonymous
      summary: This OpenAPI document, as JSON
      tags: [meta]
      responses:
        "200":
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
  /healthz/live:
    get:
      operationId: getLiveness
      x-meshsdr-access: anonymous
      summary: Liveness (no details)
      tags: [health]
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /healthz/ready:
    get:
      operationId: getReadiness
      x-meshsdr-access: anonymous
      summary: Readiness (ok or degraded, no internals)
      tags: [health]
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getSession
      x-meshsdr-access: anonymous
      summary: Current identity, roles, CSRF token and auth providers
      description: |
        Returns the caller's identity and the CSRF token to send in
        `X-CSRF-Token` on state-changing requests. Without a session, the
        token is bound to a pre-session cookie set by this response
        (login and other anonymous forms).
      tags: [auth]
      responses:
        "200":
          description: Current session (or anonymous)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      x-meshsdr-access: anonymous
      summary: Form login with a username or e-mail and a password
      description: |
        Opens a new session (any session presented is revoked) and sets the
        session cookie. Every failure answers the same `invalid_credentials`
        whether or not the account exists; throttled attempts answer 429
        `rate_limited` with `Retry-After`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      x-meshsdr-access: listener
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
        default:
          $ref: "#/components/responses/Problem"
  /nodes:
    get:
      operationId: listNodes
      x-meshsdr-access: admin
      summary: List nodes and their status (admin)
      tags: [grid]
      responses:
        "200":
          description: Nodes, ordered by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createNode
      x-meshsdr-access: admin
      summary: Declare a node and get its enrollment token, shown once (admin)
      tags: [grid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: Node declared, pending enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeEnrollment"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      operationId: getNode
      x-meshsdr-access: admin
      summary: Node detail with recent load history (admin)
      tags: [grid]
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateNode
      x-meshsdr-access: admin
      summary: Update the name, URL or disabled flag of a node (admin; 409 setting_locked for config-set fields)
      tags: [grid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodePatch"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteNode
      x-meshsdr-access: admin
      summary: Remove a node and revoke its certificate (admin; 409 entity_locked for config nodes)
      tags: [grid]
      responses:
        "204":
          description: Node removed
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{id}/enrollment-token:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: issueNodeEnrollmentToken
      x-meshsdr-access: admin
      summary: Issue a new enrollment token (re-enrollment), shown once (admin)
      tags: [grid]
      responses:
        "200":
          description: Node back to pending enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeEnrollment"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{id}/capabilities:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      operationId: getNodeCapabilities
      x-meshsdr-access: admin
      summary: Last capability report of a node (admin)
      tags: [grid]
      responses:
        "200":
          description: Capability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeCapabilities"
        default:
          $ref: "#/components/responses/Problem"
  /nodes/{id}/capabilities/probe:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: probeNodeCapabilities
      x-meshsdr-access: admin
      summary: Ask a connected node to re-probe its capabilities (admin; 503 node_unavailable when not connected)
      tags: [grid]
      responses:
        "202":
          description: Probe requested; the new report arrives on the control channel
        default:
          $ref: "#/components/responses/Problem"
  /devices:
    get:
      operationId: listDevices
      x-meshsdr-access: admin
      summary: Device registry, mirrored read-only from node configs (admin for now)
      tags: [grid]
      responses:
        "200":
          description: Devices ordered by node and config order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        default:
          $ref: "#/components/responses/Problem"
  /devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
    get:
      operationId: getDevice
      x-meshsdr-access: operator
      summary: One device of the registry, with its node-config values (ADM-008)
      description: |
        Read-only: devices are configured only in their node config. A
        device its node no longer reports carries `missing_since`.
      tags: [grid]
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: forgetDevice
      x-meshsdr-access: admin
      summary: Forget a device its node no longer reports (ADM-009)
      description: |
        Deletes the registry entry of a device whose node reported its
        devices without it (`missing_since` set). A device still reported,
        or whose node is only offline, answers 409 `device_reported`: it is
        removed by deleting it from the node config first. Audited.
      tags: [grid]
      responses:
        "204":
          description: Forgotten
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /connections:
    get:
      operationId: listConnections
      x-meshsdr-access: anonymous
      summary: Presence registry. Anonymous callers get the count only; admins also get the connections.
      tags: [grid]
      responses:
        "200":
          description: Open connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        default:
          $ref: "#/components/responses/Problem"
  /features:
    get:
      operationId: getFeatures
      x-meshsdr-access: anonymous
      summary: Public feature summary (API-001)
      description: |
        The enabled devices the caller may listen to (effective listen
        policy: the device's node config override, else the global
        `listen_policy`), each with the modes its node reports available.
        It never carries node addresses, versions or missing requirements:
        the detailed report is `GET /nodes/{id}/capabilities` (admin).
      tags: [grid]
      responses:
        "200":
          description: Feature summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
        default:
          $ref: "#/components/responses/Problem"
  /auth/setup/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The single-use token of the setup link (it is redacted from logs).
        schema:
          type: string
          maxLength: 128
    get:
      operationId: checkSetup
      x-meshsdr-access: anonymous
      summary: Check a first-admin setup link (AUTH-018)
      description: |
        Answers 200 while the hub has no admin and the token is the pending
        one, 404 `setup_token_invalid` otherwise. Only from
        `admin.allowed_networks` (403 `admin_network_denied`); throttled per
        client address (429 `rate_limited` with `Retry-After`).
      tags: [auth]
      responses:
        "200":
          description: The link is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupInfo"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/setup:
    post:
      operationId: completeSetup
      x-meshsdr-access: anonymous
      summary: Create the first admin with a setup link (AUTH-018)
      description: |
        Creates the first admin with a local password that follows the
        password policy, consumes the token and signs the admin in (the
        session cookie is set). Same network and rate limits as
        `GET /auth/setup/{token}`; 404 `setup_token_invalid` for an unknown,
        expired or used token, or once an admin exists.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: The admin is created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password:
    post:
      operationId: changePassword
      x-meshsdr-access: listener
      summary: Change the caller's password
      description: |
        Checks the current password and sets a new one that follows the
        password policy and differs from the current one. Every session of
        the user is revoked and the caller's session is replaced: the
        response sets the new session cookie and returns its CSRF token.
        A wrong current password counts as a failed login (429
        `rate_limited` with `Retry-After` while throttled). Allowed while
        the user must change the password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed. The new session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    get:
      operationId: getSettings
      x-meshsdr-access: admin
      summary: Every setting with its effective value, source and lock (ADM-002)
      description: |
        Each setting is resolved with the precedence config (locked) > DB >
        default. A key set in hub.toml or the env is locked: writes answer
        409 `setting_locked`. Secret values are never returned (`set`
        only). The ETag is the settings revision.
      tags: [settings]
      responses:
        "200":
          description: Settings
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsList"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSettings
      x-meshsdr-access: admin
      summary: Write settings atomically (ADM-002)
      description: |
        `values` maps keys to new values; `null` resets a key to its
        default. `versions` gives, per key, the version last read (`0`
        when the key had no DB value): a stale version answers 409
        `version_conflict`. Invalid values answer 422 `invalid_setting`
        with one entry per key in `errors`. A locked key answers 409
        `setting_locked`. Nothing is written unless every change is valid.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Settings after the write
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsList"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings/{key}:
    delete:
      operationId: deleteSetting
      x-meshsdr-access: admin
      summary: Reset a setting to its default (same as PATCH with null)
      tags: [settings]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            maxLength: 160
        - name: version
          in: query
          description: Version last read (0 when the key had no DB value). Omitted, any version is reset.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "204":
          description: Reset
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings/schema:
    get:
      operationId: getSettingsSchema
      x-meshsdr-access: admin
      summary: JSON Schema of the settings namespace
      description: |
        The [settings] table of hub.toml: property paths are the setting
        keys. Annotations: `lockable`, `secret`, `x-scope`, `x-apply`,
        `x-public`, `x-widget`, `x-label`, `x-min-duration`,
        `x-max-duration`.
      tags: [settings]
      responses:
        "200":
          description: JSON Schema (draft 2020-12)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
  /settings/public:
    get:
      operationId: getPublicSettings
      x-meshsdr-access: anonymous
      summary: Public settings (look and feel, station information)
      tags: [settings]
      responses:
        "200":
          description: Effective values of the public keys, by key (null when unset)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  nullable: true
          x-go-type-skip-optional-pointer: true
        default:
          $ref: "#/components/responses/Problem"
  /config/effective:
    get:
      operationId: getEffectiveConfig
      x-meshsdr-access: admin
      summary: Effective configuration with sources, secrets masked (ADM-010)
      tags: [settings]
      parameters:
        - name: download
          in: query
          description: Send the document as an attachment.
          schema:
            type: boolean
      responses:
        "200":
          description: Every config key and setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        default:
          $ref: "#/components/responses/Problem"
  /retention:
    get:
      operationId: getRetention
      x-meshsdr-access: admin
      summary: Retention policies of the DB-backed stores (ADM-011)
      description: |
        Each store with its retention setting, row count, size and last
        purge. The retention values are settings (`retention.*`), written
        with `PATCH /settings`.
      tags: [retention]
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionList"
        default:
          $ref: "#/components/responses/Problem"
  /retention/{store}/purge:
    post:
      operationId: purgeStore
      x-meshsdr-access: admin
      summary: Apply the retention policy of a store now ("purge now")
      description: |
        Runs the store's retention job at once. It deletes only what the
        policy allows (never audit entries younger than 30 days) and is
        audited. 409 `job_running` when the job is already running.
      tags: [retention]
      parameters:
        - name: store
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /branding/{slot}:
    parameters:
      - name: slot
        in: path
        required: true
        schema:
          type: string
          enum: [avatar, panorama]
    get:
      operationId: getReceiverImage
      x-meshsdr-access: anonymous
      summary: The receiver avatar or panorama (ADM-004)
      tags: [branding]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The image, as stored after re-encoding
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match)
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putReceiverImage
      x-meshsdr-access: admin
      summary: Upload the receiver avatar or panorama (ADM-004)
      description: |
        A `multipart/form-data` body with one `file` part: PNG, JPEG or
        WebP by magic bytes (SVG and GIF are refused), at most 8192 × 8192
        pixels, 250 KiB for the avatar and 2 MiB for the panorama (413
        beyond, checked on the declared size before reading). The image is
        re-encoded (avatar as PNG, panorama as JPEG), which drops its
        metadata, and replaces the previous one. Audited.
      tags: [branding]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiverImage"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteReceiverImage
      x-meshsdr-access: admin
      summary: Restore the default (no image). Audited.
      tags: [branding]
      responses:
        "204":
          description: Removed (or already the default)
        default:
          $ref: "#/components/responses/Problem"
  /roles:
    get:
      operationId: listRoles
      x-meshsdr-access: admin
      summary: List the roles
      tags: [users]
      responses:
        "200":
          description: Roles, lowest rank first. listener is implicit for every account; anonymous is never granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUserRoles
      x-meshsdr-access: admin
      summary: Role grants of a user
      tags: [users]
      responses:
        "200":
          description: Grants (empty for a listener)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrants"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setUserRoles
      x-meshsdr-access: admin
      summary: Replace the role grants of a user
      description: |
        Any change revokes every session of the user (strict SR-01). The
        last enabled admin cannot lose the admin role (409 `last_admin`).
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleGrants"
      responses:
        "200":
          description: The stored grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrants"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout-all:
    post:
      operationId: logoutAll
      x-meshsdr-access: listener
      summary: Sign out every session of the caller, this one included
      tags: [auth]
      responses:
        "204":
          description: Signed out everywhere. The session cookie is cleared.
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions:
    get:
      operationId: listOwnSessions
      x-meshsdr-access: listener
      summary: The caller's active sessions
      tags: [account]
      responses:
        "200":
          description: Active sessions, most recently seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions/{ref}:
    parameters:
      - $ref: "#/components/parameters/SessionRef"
    delete:
      operationId: revokeOwnSession
      x-meshsdr-access: listener
      summary: Sign out one of the caller's sessions
      tags: [account]
      responses:
        "204":
          description: Signed out
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: listUserSessions
      x-meshsdr-access: admin
      summary: Active sessions of a user
      tags: [users]
      responses:
        "200":
          description: Active sessions, most recently seen first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}/sessions/{ref}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/SessionRef"
    delete:
      operationId: revokeUserSession
      x-meshsdr-access: admin
      summary: Sign out one session of a user
      tags: [users]
      responses:
        "204":
          description: Signed out
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}/sessions/revoke:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: revokeUserSessions
      x-meshsdr-access: admin
      summary: Sign a user out everywhere
      tags: [users]
      responses:
        "200":
          description: Number of sessions signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revoked"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      x-meshsdr-access: listener
      summary: The caller's account
      tags: [account]
      responses:
        "200":
          description: Account (no per-user preferences in v1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMe
      x-meshsdr-access: listener
      summary: Delete the caller's account
      description: |
        Needs the current password. Removes the account and its personal
        data; audit entries keep the user id as a pseudonymous id. The last
        enabled admin cannot be deleted (409 `last_admin`).
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletion"
      responses:
        "204":
          description: Deleted. The session cookie is cleared.
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      x-meshsdr-access: listener
      summary: Change the caller's display name
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/email:
    post:
      operationId: changeMyEmail
      x-meshsdr-access: listener
      summary: Change the caller's e-mail address
      description: |
        Needs the current password (SR-04; a wrong one counts as a failed
        login). With mail configured, a single-use link confirms the new
        address and the change is pending until it is opened; otherwise
        the address applies at once, unconfirmed. An empty address removes
        it. The previous address is told.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChange"
      responses:
        "200":
          description: Applied, or pending confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeResult"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /invitations:
    get:
      operationId: listInvitations
      x-meshsdr-access: admin
      summary: List invitations (pending, used, expired, revoked)
      tags: [invitations]
      responses:
        "200":
          description: Invitations, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvitation
      x-meshsdr-access: admin
      summary: Create an invitation
      description: |
        Returns the single-use link once (SR-08). With an e-mail address
        and mail configured, the link is also e-mailed.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /invitations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 36
    delete:
      operationId: revokeInvitation
      x-meshsdr-access: admin
      summary: Revoke a pending invitation
      tags: [invitations]
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    get:
      operationId: checkInvitation
      x-meshsdr-access: anonymous
      summary: Validate an invitation token
      description: Unknown, expired, revoked and used invitations answer the same 404 `invitation_invalid`.
      tags: [auth]
      responses:
        "200":
          description: The pre-set role and e-mail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCheck"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/LinkToken"
    post:
      operationId: acceptInvitation
      x-meshsdr-access: anonymous
      summary: Accept an invitation
      description: |
        Creates the account (role from the invitation, never from the
        request), marks the invitation used and signs in.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAccept"
      responses:
        "201":
          description: Account created and signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      x-meshsdr-access: anonymous
      summary: Ask for a password reset link
      description: |
        Always 202, whether or not the account exists (SR-06): the link is
        e-mailed afterwards, to the account's address, when mail is
        configured. Too many requests from a client address answer 429.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Accepted
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      x-meshsdr-access: anonymous
      summary: Set a new password with a reset token
      description: Single use; every session of the user is revoked.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: Password set
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: issuePasswordReset
      x-meshsdr-access: admin
      summary: Issue a password reset link for a user
      description: E-mailed when mail is configured and the user has an address; otherwise returned once to copy.
      tags: [users]
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReset"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users:
    get:
      operationId: listUsers
      x-meshsdr-access: admin
      summary: List users, with search and filters
      tags: [users]
      parameters:
        - name: q
          in: query
          description: Substring of the username, e-mail or display name.
          schema:
            type: string
            maxLength: 254
        - name: role
          in: query
          description: Highest global role.
          schema:
            type: string
            enum: [listener, operator, admin]
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: never_signed_in
          in: query
          schema:
            type: boolean
        - name: after
          in: query
          description: Username of the last user of the previous page.
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Users by username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      x-meshsdr-access: admin
      summary: User detail
      tags: [users]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUser
      x-meshsdr-access: admin
      summary: Delete a user (sessions revoked, personal data removed)
      tags: [users]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateUser
      x-meshsdr-access: admin
      summary: Enable or disable a user, or change its display name
      description: Disabling revokes every session; the last enabled admin cannot be disabled (409 `last_admin`).
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: setGeneratedPassword
      x-meshsdr-access: admin
      summary: Give a user a generated password to change at the next sign-in
      description: Revokes every session of the user. The password is returned only here.
      tags: [users]
      responses:
        "200":
          description: The generated password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPassword"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /users/{id}/export:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: exportUser
      x-meshsdr-access: admin
      summary: Export a user's data (GDPR request)
      tags: [users]
      responses:
        "200":
          description: The data, as a JSON document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/export:
    post:
      operationId: exportMe
      x-meshsdr-access: listener
      summary: Export the caller's data (account and sessions)
      tags: [account]
      responses:
        "200":
          description: The data, as a JSON document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        default:
          $ref: "#/components/responses/Problem"
  /audit:
    get:
      operationId: searchAudit
      x-meshsdr-access: admin
      summary: Search the audit log
      description: Newest first, paged by `before` (the id of the last entry of the previous page). Read-only.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          description: Username of the actor.
          schema:
            type: string
            maxLength: 64
        - name: action
          in: query
          description: Action prefix, for example `auth.login.`.
          schema:
            type: string
            maxLength: 64
        - name: target_type
          in: query
          schema:
            type: string
            maxLength: 32
        - name: target_id
          in: query
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: before
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"
  /auth/token:
    post:
      operationId: mintAccessToken
      x-meshsdr-access: anonymous
      summary: Get an access token for a node media connection
      description: |
        Issues a short-lived EdDSA token (`auth.token_ttl`, 5 minutes by
        default) for one node and one media connection, scoped to the node's
        devices the caller may listen to (TECHNICAL_SPEC §5.8). The client
        refreshes it in band before it expires. Derived from the live
        session: a revoked session or a changed role stops refreshes.
        Anonymous callers need a connection bound by the gateway (GRID-011);
        until then they get 401. Limited to 30 per minute per session.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The token. Never store it beyond the page's memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    LinkToken:
      name: token
      in: path
      required: true
      description: Single-use token of a link.
      schema:
        type: string
        maxLength: 64
    SessionRef:
      name: ref
      in: path
      required: true
      description: Public handle of a session (never its id).
      schema:
        type: string
        maxLength: 32
    UserID:
      name: id
      in: path
      required: true
      description: User id (UUID).
      schema:
        type: string
        maxLength: 36
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
  schemas:
    TokenRequest:
      type: object
      additionalProperties: false
      required: [node_id, cid]
      properties:
        node_id:
          type: string
          maxLength: 64
        cid:
          type: string
          description: Media connection id issued by the hub.
          maxLength: 64
    AccessToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_before:
          type: integer
          format: int64
          description: Value of `before` for the next page, when there is one.
    AuditEntry:
      type: object
      required: [id, at, actor_kind, actor, action, result]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor_kind:
          type: string
          enum: [user, anonymous, system, node, cli]
        actor_id:
          type: string
        actor:
          type: string
          description: Username, "deleted user <id>", or the actor kind.
        actor_ip:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        target:
          type: string
        result:
          type: string
          enum: [ok, denied, error]
        before:
          type: object
          additionalProperties:
            type: string
        after:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
    AccountDeletion:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password:
          type: string
          maxLength: 1024
    AccountExport:
      type: object
      description: Account data export (ACC-009); see `app.Export` for the fields.
      additionalProperties: true
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_after:
          type: string
          description: Value of `after` for the next page, when there may be one.
    User:
      type: object
      required: [id, username, email_verified, roles, enabled, must_change_password, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        roles:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        must_change_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        display_name:
          type: string
          description: Empty removes it.
          maxLength: 256
    GeneratedPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [login]
      properties:
        login:
          type: string
          description: Username or e-mail address.
          maxLength: 254
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          maxLength: 64
        new_password:
          type: string
          maxLength: 1024
    AdminReset:
      type: object
      required: [mailed]
      properties:
        mailed:
          type: boolean
        link:
          type: string
          description: The link to copy, present only when it was not e-mailed.
    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    Invitation:
      type: object
      required: [id, role, delivery, state, created_at, expires_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [listener, operator, admin]
        device_id:
          type: string
        email:
          type: string
        delivery:
          type: string
          enum: [email, link]
        state:
          type: string
          enum: [pending, redeemed, revoked, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        redeemed_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [listener, operator, admin]
        device_id:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 254
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: Validity; default `invitations.ttl_hours` (7 days).
    InvitationCreated:
      type: object
      required: [invitation, link, mailed]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        link:
          type: string
          description: The single-use link, returned only here.
        mailed:
          type: boolean
    InvitationCheck:
      type: object
      required: [role, expires_at]
      properties:
        role:
          type: string
          enum: [listener, operator, admin]
        device_id:
          type: string
        email:
          type: string
        expires_at:
          type: string
          format: date-time
    InvitationAccept:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        display_name:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024
        email:
          type: string
          description: Used only when the invitation has no address.
          maxLength: 254
    Me:
      type: object
      required: [id, username, email_verified, roles, identities, must_change_password]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        roles:
          type: array
          description: Grants, device scope after '@' ("operator@rtl-1"); "listener" when none.
          items:
            type: string
        identities:
          type: array
          description: Login methods (provider ids, `local` in v1).
          items:
            type: string
        must_change_password:
          type: boolean
    MeUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          description: Empty removes it.
          maxLength: 256
    EmailChange:
      type: object
      additionalProperties: false
      required: [email, current_password]
      properties:
        email:
          type: string
          description: New address; empty removes it.
          maxLength: 254
        current_password:
          type: string
          maxLength: 1024
    EmailChangeResult:
      type: object
      required: [pending]
      properties:
        pending:
          type: boolean
          description: True when a confirmation link was sent to the new address.
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionView"
    SessionView:
      type: object
      required: [id, current, created_at, last_seen_at, expires_at, browser, system]
      properties:
        id:
          type: string
          description: Public handle of the session.
        current:
          type: boolean
          description: True for the session of this request.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ip:
          type: string
        user_agent:
          type: string
        browser:
          type: string
        system:
          type: string
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
    RoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleInfo"
    RoleInfo:
      type: object
      required: [name, rank, grantable]
      properties:
        name:
          type: string
          enum: [listener, operator, admin]
        rank:
          type: integer
        grantable:
          type: boolean
          description: False for listener, which every account holds implicitly.
    RoleGrants:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/RoleGrant"
    RoleGrant:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [operator, admin]
        device_id:
          type: string
          description: Device scope of an operator grant; absent means every device. Admin is always global.
          maxLength: 64
    ConnectionList:
      type: object
      required: [count]
      properties:
        count:
          type: integer
        items:
          type: array
          description: Present for admins only.
          items:
            $ref: "#/components/schemas/Connection"
    Connection:
      type: object
      required: [id, kind, ip, opened_at, last_heartbeat_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [events, media, map]
        user_id:
          type: string
          format: uuid
        node_id:
          type: string
        device_id:
          type: string
        mode:
          type: string
        ip:
          type: string
        opened_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
    Features:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceFeatures"
    DeviceFeatures:
      type: object
      additionalProperties: false
      required: [id, node_id, name, online, modes]
      properties:
        id:
          type: string
        node_id:
          type: string
        name:
          type: string
        online:
          type: boolean
        modes:
          type: array
          description: Modes the device's node reports available, sorted.
          items:
            type: string
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Device:
      type: object
      required: [id, node_id, name, type, freq_min, freq_max, sample_rates, enabled, operator_can_retune, always_on, scheduler_enabled, online, runtime_state, runtime_state_at, sort_order, reported_at]
      properties:
        missing_since:
          type: string
          format: date-time
          description: Set when the node reported its devices without this one (removed from the node config); it can then be forgotten.
        id:
          type: string
        node_id:
          type: string
        name:
          type: string
        type:
          type: string
        freq_min:
          type: integer
          format: int64
        freq_max:
          type: integer
          format: int64
        sample_rates:
          type: array
          items:
            type: integer
            format: int64
        enabled:
          type: boolean
        listen_policy:
          type: string
          enum: [anonymous, registered]
        operator_can_retune:
          type: boolean
        always_on:
          type: boolean
        scheduler_enabled:
          type: boolean
        online:
          type: boolean
        runtime_state:
          type: string
          enum: [unavailable, disabled, stopped, starting, running, retuning, stopping, retry_wait, failed]
        runtime_state_at:
          type: string
          format: date-time
        runtime_reason:
          type: string
        active_preset_id:
          type: string
          format: uuid
        center_freq:
          type: integer
          format: int64
        sort_order:
          type: integer
        reported_at:
          type: string
          format: date-time
    NodeCapabilities:
      type: object
      required: [node_id, reported_at, capabilities_hash, product_version, protocols, platform, document, capabilities]
      properties:
        node_id:
          type: string
        reported_at:
          type: string
          format: date-time
        capabilities_hash:
          type: string
        product_version:
          type: string
        protocols:
          type: array
          items:
            type: string
        platform:
          type: object
          additionalProperties: true
        document:
          type: object
          description: The full node.capabilities report as received.
          additionalProperties: true
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/NodeCapability"
    NodeCapability:
      type: object
      required: [capability, available, status, detail]
      properties:
        capability:
          type: string
          example: tool:jt9
        available:
          type: boolean
        status:
          type: string
          enum: [ok, missing, too_old, untested, error]
        version:
          type: string
        detail:
          type: object
          additionalProperties: true
        error:
          type: string
    NodeCreate:
      type: object
      additionalProperties: false
      required: [id, url]
      properties:
        id:
          type: string
          description: Stable node id (the node's node.id).
          example: attic
        name:
          type: string
          description: Display name; defaults to the id.
        url:
          type: string
          description: Base URL the hub dials, https://host:port.
          example: https://10.8.0.12:8074
    NodePatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          description: Expected version (optimistic concurrency, 409 version_conflict on mismatch).
        name:
          type: string
        url:
          type: string
        disabled:
          type: boolean
    NodeEnrollment:
      type: object
      required: [node, enrollment_token, ca_fingerprint]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        enrollment_token:
          type: string
          description: Single-use enrollment token. Shown only in this response.
        ca_fingerprint:
          type: string
          description: SHA-256 fingerprint of the hub CA, to give to the node with the token.
        expires_at:
          type: string
          format: date-time
    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"
    Node:
      type: object
      required: [id, name, url, origin, locked_fields, disabled, enrollment_state, health, status, created_at, updated_at, version]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        origin:
          type: string
          enum: [config, db]
        locked_fields:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        enrollment_state:
          type: string
          enum: [pending, enrolled, revoked]
        health:
          type: string
          description: enrolling, revoked, or the runtime status.
          enum: [enrolling, online, degraded, offline, unreachable, incompatible, revoked]
        status:
          type: string
          enum: [online, degraded, offline, unreachable, incompatible]
        status_hint:
          type: string
        enrollment_expires_at:
          type: string
          format: date-time
        enrolled_at:
          type: string
          format: date-time
        cert_serial:
          type: string
        cert_fingerprint:
          type: string
        cert_not_after:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
        software_version:
          type: string
        protocol_version:
          type: string
        hostname:
          type: string
        cpu_cores:
          type: integer
        clock_offset_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    NodeDetail:
      type: object
      required: [node, load_history]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        load_history:
          type: array
          description: Recent heartbeats (RAM ring, last hour).
          items:
            $ref: "#/components/schemas/LoadSample"
    LoadSample:
      type: object
      required: [at, cpu, load1, mem_available_bytes, mem_total_bytes]
      properties:
        at:
          type: string
          format: date-time
        cpu:
          type: number
          format: double
        load1:
          type: number
          format: double
        temp_c:
          type: number
          format: double
        mem_available_bytes:
          type: integer
          format: int64
        mem_total_bytes:
          type: integer
          format: int64
    SessionInfo:
      type: object
      required: [authenticated, roles, csrf_token, providers]
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/SessionUser"
        roles:
          type: array
          description: Roles held globally or on some device, lowest first. Empty when anonymous.
          items:
            type: string
            enum: [listener, operator, admin]
        csrf_token:
          type: string
          description: Value of the X-CSRF-Token header for state-changing requests.
        providers:
          type: array
          description: Available auth providers (`local` only in v1).
          items:
            type: string
    SessionUser:
      type: object
      required: [id, username, must_change_password]
      properties:
        id:
          type: string
          description: User id (UUID).
          example: 0192c3a4-5b6c-7d8e-9f01-23456789abcd
        username:
          type: string
        display_name:
          type: string
        must_change_password:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: Username or e-mail address.
          maxLength: 254
        password:
          type: string
          maxLength: 1024
        remember_me:
          type: boolean
          description: Keep the session for 30 days instead of 24 hours.
    SetupInfo:
      type: object
      required: [min_password_length]
      properties:
        min_password_length:
          type: integer
          description: Minimum length of the new password (`auth.password_min_length`).
    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, username, password]
      properties:
        token:
          type: string
          maxLength: 128
        username:
          type: string
          maxLength: 254
        email:
          type: string
          maxLength: 254
        display_name:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 1024
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 1024
        new_password:
          type: string
          description: At least `auth.password_min_length` (default 10) and at most 256 characters, not a common password.
          maxLength: 1024
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    Problem:
      description: RFC 9457 problem details, served as application/problem+json.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Always "about:blank"; the error is identified by `code`.
          example: about:blank
        title:
          type: string
          description: Short summary of the HTTP status.
          example: Not Found
        status:
          type: integer
          example: 404
        code:
          type: string
          description: Stable snake_case error code.
          example: not_found
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        errors:
          type: array
          description: Field errors of an invalid request.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          example: username
        code:
          type: string
          example: required
        message:
          type: string
    SettingsList:
      type: object
      required: [revision, settings]
      properties:
        revision:
          type: integer
          format: int64
          description: Settings revision (also the ETag).
        settings:
          type: array
          items:
            $ref: "#/components/schemas/Setting"
    Setting:
      type: object
      required: [key, source, origin, locked, version, secret, public, apply, label]
      properties:
        key:
          type: string
          example: ui.theme_mode
        value:
          description: Effective value. Absent for secrets.
          nullable: true
          x-go-type-skip-optional-pointer: true
        set:
          type: boolean
          description: Secrets only. Whether a value is set.
        default:
          description: Built-in default. Absent for secrets.
          nullable: true
          x-go-type-skip-optional-pointer: true
        source:
          type: string
          enum: [cfg, db, default]
        origin:
          type: string
          description: '"hub.toml:42", "env:MESHSDR_…", "db" or "default".'
        locked:
          type: boolean
        version:
          type: integer
          format: int64
          description: Version of the DB value (0 when there is none), to send back on writes.
        shadowed_value:
          description: DB value hidden by a config value ("overridden by config"). Absent for secrets.
          nullable: true
          x-go-type-skip-optional-pointer: true
        secret:
          type: boolean
        public:
          type: boolean
        apply:
          type: string
          enum: [live, restart]
        label:
          type: string
        description:
          type: string
    SettingsPatch:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: object
          description: New values by key; null resets a key to its default.
          additionalProperties:
            nullable: true
            x-go-type-skip-optional-pointer: true
          x-go-type-skip-optional-pointer: true
        versions:
          type: object
          description: Version last read, by key (0 when the key had no DB value).
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    EffectiveConfig:
      type: object
      required: [generated_at, revision, entries]
      properties:
        generated_at:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ConfigEntry"
    ConfigEntry:
      type: object
      required: [key, class, source, origin, locked, secret]
      properties:
        key:
          type: string
          description: Dotted key; settings keys keep their hub.toml name (settings.…).
        class:
          type: string
          enum: [cfg, db]
          description: cfg for config-only keys, db for settings (lockable).
        value:
          description: Effective value. Absent for secrets.
          nullable: true
          x-go-type-skip-optional-pointer: true
        set:
          type: boolean
          description: Secrets only.
        source:
          type: string
          enum: [cfg, db, default]
        origin:
          type: string
        locked:
          type: boolean
        secret:
          type: boolean
    RetentionList:
      type: object
      required: [stores]
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/RetentionStore"
    RetentionStore:
      type: object
      required: [store, label, setting_key, retention, rows, job]
      properties:
        store:
          type: string
          example: sessions
        label:
          type: string
        setting_key:
          type: string
          example: retention.sessions
        retention:
          type: string
          description: Effective retention, as a duration string.
          example: 30d
        rows:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
          description: Size of the table and its indexes. Absent when unknown.
        job:
          $ref: "#/components/schemas/JobRun"
    JobRun:
      type: object
      required: [name, running]
      properties:
        name:
          type: string
          example: sessions.reap
        running:
          type: boolean
        last_started_at:
          type: string
          format: date-time
        last_finished_at:
          type: string
          format: date-time
        last_status:
          type: string
          enum: [ok, error]
        last_error:
          type: string
        rows_affected:
          type: integer
          format: int64
    PurgeResult:
      type: object
      required: [store, rows_deleted]
      properties:
        store:
          type: string
        rows_deleted:
          type: integer
          format: int64
    ReceiverImage:
      type: object
      required: [slot, name, mime_type, size_bytes, width, height, sha256]
      properties:
        slot:
          type: string
          enum: [avatar, panorama]
        name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the stored image.
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
