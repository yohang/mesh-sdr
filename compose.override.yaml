services:
  app:
    build:
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      # Dev config (hub.toml with http://localhost:3000 and
      # allow_insecure_url, node.toml) committed in the repository.
      MESHSDR_CONFIG_DIR: /app/.infra/docker/dev/config
    volumes:
      - .:/app
      - go-cache:/cache

  # Development mail relay (profile "mail"): catches every message, web UI on
  # http://localhost:${MAILPIT_PORT:-8025}. Start it with
  # `docker compose --profile mail up -d mailpit`, and point the hub at it
  # through .env (see .env.example).
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    profiles: [mail]
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  go-cache:
