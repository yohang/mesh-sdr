services:
  app:
    build:
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      # Dev config (hub.toml with http://localhost:3000 and
      # allow_insecure_url, node.toml) committed in the repository.
      MESHSDR_CONFIG_DIR: /app/.infra/docker/dev/config
    volumes:
      - .:/app
      - go-cache:/cache

volumes:
  go-cache:
