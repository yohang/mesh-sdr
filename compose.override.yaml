services:
  app:
    build:
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Replaces the base environment: the committed dev config
    # (hub.toml, node.toml) holds every value.
    environment: !override
      MESHSDR_CONFIG_DIR: /app/.infra/docker/dev/config
    volumes:
      - .:/app
      - go-cache:/cache

volumes:
  go-cache:
