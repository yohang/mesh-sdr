# Dev stack hub config (compose sets MESHSDR_CONFIG_DIR to this directory).
# Paths are relative to /app, the bind-mounted repository.
schema_version = 1

[hub]
url = "http://localhost:3000"
allow_insecure_url = true

[gateway]
tls_mode = "off"
http_listen = "0.0.0.0:8073"

[db]
dsn = "sqlite:var/hub.db"

[log]
level = "debug"
format = "text"

[auth]
# Token signing keys of the dev stack (gitignored var/).
token_key_dir = "var/keys"
