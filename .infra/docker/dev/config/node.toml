# Dev node config: the local node of `meshsdr all` (Air), or a standalone
# `go run ./cmd/meshsdr node` in the dev container. Under `all`, its
# certificate and the hub CA are created in tls/ next to this file
# (ignored by version control).
schema_version = 1

[node]
id = "dev"
listen = "127.0.0.1:8074"

[log]
level = "debug"
format = "text"

# The dev image has no SDR hardware: the device below runs the fake
# owrx_connector (built by Air into tmp/), which synthesises an NFM
# carrier at centre + 128 kHz modulated by a 1 kHz tone.
[tools]
rtl_connector = "/app/tmp/fakeconnector"

[devices.dev-rtl]
name = "Synthetic RTL-SDR"
type = "rtl_sdr"
freq_range = { min = "144MHz", max = "146MHz" }
sample_rates = [1_024_000]
listen_policy = "anonymous"
operator_can_retune = true

# A second synthetic device whose NFM carrier (centre + 128 kHz) carries the
# ZVEI1 sequence 12345 every 2 s: the ZVEI digital mode decodes it with
# multimon-ng (DEC-035).
[devices.dev-zvei]
name = "Synthetic ZVEI"
type = "rtl_sdr"
freq_range = { min = "430MHz", max = "432MHz" }
sample_rates = [1_024_000]
listen_policy = "anonymous"
driver = { device = "zvei" }

# A third synthetic device whose USB dial at centre + 128 kHz carries the
# text modes of the native decoders: SITOR-B at +600 Hz, BPSK31 at
# +1000 Hz, CW at +1500 Hz and RTTY-170 at +2200 Hz (DEC-006 to DEC-012).
[devices.dev-text]
name = "Synthetic text modes"
type = "rtl_sdr"
freq_range = { min = "14MHz", max = "15MHz" }
sample_rates = [1_024_000]
listen_policy = "anonymous"
driver = { device = "text" }
