- key: FIL-008
  title: '[FIL-008] Reception metadata for received files'
  milestone: M2
  area: FIL
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:FIL
  - priority:P1
  epic: EPIC-M2-FIL
  depends_on:
  - FIL-005
  - DEC-037
  - DEC-038
  - SVC-017
  spec_ref: docs/spec/FEATURE_SPEC.md#614-files-fil
  body: |-
    ## Summary

    Every file produced by a decoder or a recording (SSTV, FAX, recordings, transcripts, skimmer logs, satellite images) MUST be stored with DB metadata. At least: **reception start date-time in UTC** (`received_start_utc`) and **reception frequency in Hz** (`frequency_hz`, the dial frequency the decoder was tuned to). Also, when known: reception end (UTC), mode, device, node, active preset, decoder session, and per-kind details (SSTV: mode name, VIS code, lines received/total, complete flag, optional SNR; FAX: LPM, IOC). The node stamps these values from its NTP-synchronised clock when reception starts. The hub checks the clock skew. The fields can be filtered and sorted in the gallery and the API, and are shown in the detail view.

    | | |
    |---|---|
    | **Entry point** | automatic (file producers); Files › filters, detail view; `GET /api/v1/files?from=&to=&freq_min=&freq_max=` |
    | **Gate** | `files.visibility (db)` |
    | **Milestone** | M2 |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] Every file produced by a decoder or a recording (SSTV, FAX, recordings, transcripts, skimmer logs, satellite images) MUST be stored with DB metadata.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    FIL-005, DEC-037, DEC-038, SVC-017

    ## Spec

    FEATURE_SPEC §6 · [Files (FIL)]({{SPEC_BASE}}/FEATURE_SPEC.md#614-files-fil) — row `FIL-008`.
