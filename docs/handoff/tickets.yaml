  - SRC-022
  - DIAG-001
  spec_ref: docs/spec/FEATURE_SPEC.md#624-digital-voice-dv
  body: |-
    ## Summary

    The endpoint is set only in the node config (cfg), at node level or per device. A connection failure MUST produce an `UNAVAILABLE`/`DECODER_ERROR` diagnostic state with a hint such as "codecserver unreachable". The node MUST also report AMBE availability in its capabilities. The admin UI shows the endpoint read-only.

