  - priority:P1
  epic: EPIC-M1b-DIAG
  depends_on:
  - DIAG-001
  spec_ref: docs/spec/FEATURE_SPEC.md#613-decoding-diagnostics-diag
  body: |-
    ## Summary

    The node measures in-band power against the device noise floor (from the main FFT) for each session's passband, to separate `NO_SIGNAL` from the other states for every decoder, including those that only have heuristic signals. The threshold is per mode with a sensible default.

