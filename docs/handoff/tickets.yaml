    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] The receiver MUST show the pack and hub bookmarks that fall inside the current band (`center_freq ± samp_rate/2`) of the selected device and match its scope (BMK-008).
    - [ ] Clicking one MUST tune the user's **own** demodulator (mode, underlying mode and exact frequency), stop the scanner and show the bubble.
    - [ ] The list MUST be pushed again when the band changes or a bookmark visible in this band is created, edited or deleted.
