- key: ADM-048
  title: '[ADM-048] Migration tool from OpenWebRX+'
  milestone: M5
  area: ADM
  priority: P2
  effort: 13
  labels:
  - type:feature
  - area:ADM
  - priority:P2
  epic: EPIC-M5-ADM
  depends_on:
  - ADM-010
  - AUTH-017
  spec_ref: docs/spec/FEATURE_SPEC.md#64-administration-adm
  body: |-
    ## Summary

    `<product> import-openwebrx --from <dir>` reads an OpenWebRX+ installation: `settings.json` (any schema version), `users.json`, `bookmarks.json`, receiver images and decoded files. It produces (a) a node config file with the device definitions, (b) a hub config file with secrets and infrastructure keys, and (c) DB rows for settings, presets (device links dropped and reported), schedules, hub bookmarks and users. PBKDF2 hashes are kept and rehashed with Argon2id at the next successful login. Files keep the reception UTC time and frequency parsed from their OpenWebRX+ file names. It MUST never execute `config_webrx.py`. It prints a report of every key it cannot map (magic key, WiFi, chat, bans, client limits, rig, TX, personal bookmarks, colour themes) and is idempotent (dry-run by default, `--apply` to write). split: config files, DB rows, files and users.

    | | |
    |---|---|
    | **Entry point** | CLI on the hub host |
    | **Gate** | — |
    | **Milestone** | M5 |
    | **Priority** | P2 |
    | **Effort** | 13 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | ❌ | ✅ (CLI) |

    ## Acceptance criteria

    - [ ] It MUST never execute `config_webrx.py`.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    ADM-010, AUTH-017

    ## Spec

    FEATURE_SPEC §6 · [Administration (ADM)]({{SPEC_BASE}}/FEATURE_SPEC.md#64-administration-adm) — row `ADM-048`.
