  spec_ref: docs/spec/FEATURE_SPEC.md#621-background-services--scheduler-svc
  body: |-
    ## Summary

    After the device is running plus a settle delay, collect bandplan dial frequencies inside the passband, filter them by SVC-003 and start one chain per dial. The hub computes the dial list. The node starts the chains. The settle delay is configurable (default 10 s).

