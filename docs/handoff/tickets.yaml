- key: AUTH-002
  title: '[AUTH-002] Credential check'
  milestone: M0
  area: AUTH
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:AUTH
  - priority:P1
  epic: EPIC-M0-AUTH
  depends_on:
  - AUTH-003
  - AUTH-017
  spec_ref: docs/spec/FEATURE_SPEC.md#62-authentication-auth
  body: |-
    ## Summary

    `POST /api/v1/auth/login` (JSON). It MUST: run the password hash for unknown users too (no user enumeration by timing); return one generic error; rate-limit per IP and per account with progressive delay or lockout (`auth.login_rate_limit`); rotate the session id on login; and set the cookie with `HttpOnly`, `Secure`, `SameSite=Lax` and `Path=/`. After login, the browser goes to `next` only when it is a same-origin relative path (no `//`, no scheme), otherwise to `/`. A missing `next` MUST NOT cause an error.

    | | |
    |---|---|
    | **Entry point** | `POST /api/v1/auth/login` |
    | **Gate** | `auth.login_rate_limit (db)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ✅ | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] It MUST: run the password hash for unknown users too (no user enumeration by timing); return one generic error; rate-limit per IP and per account with progressive delay or lockout (`auth.login_rate_limit`); rotate the session id on login; and set the cookie with `HttpOnly`, `Secure`, `SameSite=Lax` and `Path=/`.
    - [ ] A missing `next` MUST NOT cause an error.
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    AUTH-003, AUTH-017

    ## Spec

    FEATURE_SPEC §6 · [Authentication (AUTH)]({{SPEC_BASE}}/FEATURE_SPEC.md#62-authentication-auth) — row `AUTH-002`.
- key: AUTH-003
  title: '[AUTH-003] Sessions'
  milestone: M0
  area: AUTH
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:AUTH
  - priority:P1
  epic: EPIC-M0-AUTH
  depends_on:
  - GRID-001
  spec_ref: docs/spec/FEATURE_SPEC.md#62-authentication-auth
  body: |-
    ## Summary

    Sessions are `sessions` rows (hashed id, user, created, last seen, IP, user agent, login method). They have an idle timeout (`session.idle_timeout`) and an absolute lifetime (`session.absolute_timeout`), and they survive restarts. All of a user's sessions MUST be revoked on password change or reset, disable, deletion or role downgrade. Users can list and revoke their own sessions (ACC-005). Expired rows are purged periodically.

    | | |
    |---|---|
    | **Entry point** | cookie |
    | **Gate** | `session.idle_timeout (db)`, `session.absolute_timeout (db)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | — | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] All of a user's sessions MUST be revoked on password change or reset, disable, deletion or role downgrade.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

