- key: SRC-006
  title: '[SRC-006] Presets'
  milestone: M1a
  area: SRC
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:SRC
  - priority:P1
  epic: EPIC-M1a-SRC
  depends_on:
  - SRC-022
  spec_ref: docs/spec/FEATURE_SPEC.md#68-sdr-sources--hardware-src
  body: |-
    ## Summary

    `presets` are pure data stored in the hub DB, independent of any device or node (the table has no `device_id` or `node_id`). A preset holds name, center frequency, sample rate, start frequency and mode, tuning step, initial squelch and NR, waterfall levels, and an optional description and tags. Admins manage them by CRUD. Applying a preset to a device MUST be validated at apply time against that device's capabilities (frequency range, supported sample rates). Incompatible presets are hidden from the picker or refused with a clear error. Unknown ids return 404. A preset MUST NOT carry device tunables (gain, ppm etc.), which are cfg-only.

    | | |
    |---|---|
    | **Entry point** | Admin → Presets, `/api/v1/presets` |
    | **Gate** | `presets` (db) |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | 👁 | ✅ |

    ## Acceptance criteria

    - [ ] Applying a preset to a device MUST be validated at apply time against that device's capabilities (frequency range, supported sample rates).
    - [ ] A preset MUST NOT carry device tunables (gain, ppm etc.), which are cfg-only.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SRC-022

    ## Spec

    FEATURE_SPEC §6 · [SDR sources & hardware (SRC)]({{SPEC_BASE}}/FEATURE_SPEC.md#68-sdr-sources--hardware-src) — row `SRC-006`.
