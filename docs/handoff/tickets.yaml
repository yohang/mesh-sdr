- key: RX-010
  title: '[RX-010] Center-frequency change'
  milestone: M1a
  area: RX
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:RX
  - priority:P1
  epic: EPIC-M1a-RX
  depends_on:
  - SRC-008
  - UI-012
  spec_ref: docs/spec/FEATURE_SPEC.md#67-receiver-core-rx
  body: |-
    ## Summary

    WS `set_center_frequency` (a jump by ±bw/4 or an explicit value) MUST be accepted only from an operator on a device with `operator_can_retune`, or from an admin. Any other request MUST get an explicit `forbidden` error, never a silent failure. The UI MUST hide or disable the control (with a tooltip) for users without the right. A change affecting other listeners asks for confirmation (UI-012), is written to `audit_log` and is announced to the device's listeners.

    | | |
    |---|---|
    | **Entry point** | control bar, right-click tune buttons, `PageUp/PageDown` |
    | **Gate** | `devices.<id>.operator_can_retune` (cfg) |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | ⚙️ `devices.<id>.operator_can_retune` | ✅ |

    ## Acceptance criteria

    - [ ] WS `set_center_frequency` (a jump by ±bw/4 or an explicit value) MUST be accepted only from an operator on a device with `operator_can_retune`, or from an admin.
    - [ ] Any other request MUST get an explicit `forbidden` error, never a silent failure.
    - [ ] The UI MUST hide or disable the control (with a tooltip) for users without the right.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SRC-008, UI-012

    ## Spec

    FEATURE_SPEC §6 · [Receiver core (RX)]({{SPEC_BASE}}/FEATURE_SPEC.md#67-receiver-core-rx) — row `RX-010`.
