    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    AUTH-003, AUTH-017

    ## Spec

    FEATURE_SPEC §6 · [Authentication (AUTH)]({{SPEC_BASE}}/FEATURE_SPEC.md#62-authentication-auth) — row `AUTH-020`.
