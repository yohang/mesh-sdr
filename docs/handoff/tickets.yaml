  spec_ref: docs/spec/FEATURE_SPEC.md#64-administration-adm
  body: |-
    ## Summary

    `DELETE /api/v1/presets/{id}` after a confirmation modal. Deleting a preset never retunes a device: a device on which it is active keeps its current tuning. Schedules that reference the preset are listed and MUST be fixed before deletion (409 otherwise).

