- key: RX-040
  title: '[RX-040] Grid-aware device selection'
  milestone: M1b
  area: RX
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:RX
  - priority:P1
  epic: EPIC-M1b-RX
  depends_on:
  - SRC-021
  - SRC-023
  - UI-021
  - GRID-020
  spec_ref: docs/spec/FEATURE_SPEC.md#67-receiver-core-rx
  body: |-
    ## Summary

    A user MUST be able to pick any device from any online node in one list (UI-021). Selecting a device closes the previous node WS and opens `/nodes/{nodeId}/ws` for the new one with a device-scoped token. The hub MUST issue the token only if the user's role satisfies the device's effective `listen_policy`. The node MUST re-check the token, so an attach that bypasses the policy is impossible. The choice affects only the user's own connection.

    | | |
    |---|---|
    | **Entry point** | device picker, WS reconnect |
    | **Gate** | `listen_policy` (cfg\|db), `devices.<id>.listen_policy` (cfg) |
    | **Milestone** | M1b |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] A user MUST be able to pick any device from any online node in one list (UI-021).
    - [ ] The hub MUST issue the token only if the user's role satisfies the device's effective `listen_policy`.
    - [ ] The node MUST re-check the token, so an attach that bypasses the policy is impossible.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SRC-021, SRC-023, UI-021, GRID-020

    ## Spec

    FEATURE_SPEC §6 · [Receiver core (RX)]({{SPEC_BASE}}/FEATURE_SPEC.md#67-receiver-core-rx) — row `RX-040`.
