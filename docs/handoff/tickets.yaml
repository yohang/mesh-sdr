  - GRID-012
  - AUTH-003
  - RX-040
  spec_ref: docs/spec/FEATURE_SPEC.md#67-receiver-core-rx
  body: |-
    ## Summary

    On load, the Receiver page MUST fetch `/api/v1/me` and `/api/v1/devices` and open the hub events WS `/api/ws`. For the selected device it MUST obtain an access token scoped to that device and open `/nodes/{nodeId}/ws` via the gateway with subprotocol `rx.v1`. The token MUST be presented in the handshake, and the node MUST verify it offline with the hub public key.

    | | |
    |---|---|
    | **Entry point** | `/receiver`, `/api/ws`, `/nodes/{nodeId}/ws` |
    | **Gate** | `listen_policy` (cfg\|db), `devices.<id>.listen_policy` (cfg) |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] On load, the Receiver page MUST fetch `/api/v1/me` and `/api/v1/devices` and open the hub events WS `/api/ws`.
    - [ ] For the selected device it MUST obtain an access token scoped to that device and open `/nodes/{nodeId}/ws` via the gateway with subprotocol `rx.v1`.
    - [ ] The token MUST be presented in the handshake, and the node MUST verify it offline with the hub public key.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    GRID-011, GRID-012, AUTH-003, RX-040

    ## Spec

    FEATURE_SPEC §6 · [Receiver core (RX)]({{SPEC_BASE}}/FEATURE_SPEC.md#67-receiver-core-rx) — row `RX-002`.
- key: RX-003
  title: '[RX-003] Auto-reconnect with backoff'
  milestone: M1a
  area: RX
  priority: P1
  effort: 3
  labels:
  - type:feature
  - area:RX
  - priority:P1
  epic: EPIC-M1a-RX
  depends_on:
  - RX-002
  - UI-022
  spec_ref: docs/spec/FEATURE_SPEC.md#67-receiver-core-rx
  body: |-
    ## Summary

    The hub WS and the node WS MUST reconnect independently with exponential backoff (1 s doubling, capped at 60 s, with jitter). A server `backoff` message MUST carry `retry_after`, which the client honours. Before reconnecting, the client MUST refresh an expired access token. Connection state is shown as a chip (UI-022).

    | | |
    |---|---|
    | **Entry point** | automatic |
    | **Gate** | — |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 3 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] The hub WS and the node WS MUST reconnect independently with exponential backoff (1 s doubling, capped at 60 s, with jitter).
    - [ ] A server `backoff` message MUST carry `retry_after`, which the client honours.
    - [ ] Before reconnecting, the client MUST refresh an expired access token.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    RX-002, UI-022

    ## Spec

    FEATURE_SPEC §6 · [Receiver core (RX)]({{SPEC_BASE}}/FEATURE_SPEC.md#67-receiver-core-rx) — row `RX-003`.
