- key: ACC-007
  title: '[ACC-007] Access token issuance'
  milestone: M0
  area: ACC
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:ACC
  - priority:P1
  epic: EPIC-M0-ACC
  depends_on:
  - AUTH-003
  - GRID-008
  spec_ref: docs/spec/FEATURE_SPEC.md#63-accounts--access-acc
  body: |-
    ## Summary

    The hub issues a signed access token (Ed25519, TTL about 5 min) carrying the user id (or an anonymous connection id), roles and device scopes, through `POST /api/v1/auth/token` or the events socket. The client refreshes it before expiry. Nodes verify it offline with the hub's public key. A disable, deletion or role downgrade stops refreshes, and the hub tells nodes to close the affected sockets at once.

    | | |
    |---|---|
    | **Entry point** | `POST /api/v1/auth/token` |
    | **Gate** | `auth.token_ttl_s (cfg)`, `auth.signing_key_file (cfg)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    AUTH-003, GRID-008

    ## Spec

    FEATURE_SPEC §6 · [Accounts & access (ACC)]({{SPEC_BASE}}/FEATURE_SPEC.md#63-accounts--access-acc) — row `ACC-007`.
