- key: AUTH-019
  title: '[AUTH-019] CSRF protection'
  milestone: M0
  area: AUTH
  priority: P1
  effort: 3
  labels:
  - type:feature
  - area:AUTH
  - priority:P1
  epic: EPIC-M0-AUTH
  depends_on:
  - AUTH-003
  spec_ref: docs/spec/FEATURE_SPEC.md#62-authentication-auth
  body: |-
    ## Summary

    Every state-changing request (`POST`, `PUT`, `PATCH`, `DELETE`, and state-changing `/api/ws` messages) MUST be protected against CSRF: `SameSite=Lax` session cookie, a synchronizer token bound to the session and sent in a request header, JSON-only bodies with a strict `Content-Type` check, and an `Origin` check against `hub.url` on the WebSocket upgrade. The login, invitation-acceptance and password-reset forms are covered too. A failed check returns `403` and is logged.

    | | |
    |---|---|
    | **Entry point** | all state-changing routes |
    | **Gate** | `hub.url (cfg)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 3 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ✅ | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] Every state-changing request (`POST`, `PUT`, `PATCH`, `DELETE`, and state-changing `/api/ws` messages) MUST be protected against CSRF: `SameSite=Lax` session cookie, a synchronizer token bound to the session and sent in a request header, JSON-only bodies with a strict `Content-Type` check, and an `Origin` check against `hub.url` on the WebSocket upgrade.
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    AUTH-003

    ## Spec

    FEATURE_SPEC §6 · [Authentication (AUTH)]({{SPEC_BASE}}/FEATURE_SPEC.md#62-authentication-auth) — row `AUTH-019`.
- key: AUTH-020
