    A hub job scheduler runs each web-data agent (EIBI, repeaters, receivers) at its period with jitter. Failures use exponential backoff and **do not give up until restart**: they are recorded and shown as a health warning. Requests use an honest product User-Agent. Results go to `web_caches`.

