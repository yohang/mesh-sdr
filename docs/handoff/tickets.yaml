    | **Milestone** | M1a |
    | **Priority** | P2 |
    | **Effort** | 3 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | 👁 | 👁 | 👁 | 👁 |

    ## Acceptance criteria

    - [ ] When an operator or admin changes the preset or center frequency of a device, the node MUST push the new state to every connected client.
    - [ ] The hub MUST emit a `device.state` event on `/api/ws` so device pickers update live.
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    RX-006, RX-010, UI-011

    ## Spec

    FEATURE_SPEC §6 · [Receiver core (RX)]({{SPEC_BASE}}/FEATURE_SPEC.md#67-receiver-core-rx) — row `RX-042`.
