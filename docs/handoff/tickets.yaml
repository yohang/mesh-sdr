  spec_ref: docs/spec/FEATURE_SPEC.md#64-administration-adm
  body: |-
    ## Summary

    Settings pages read `GET /api/v1/settings` (value, source: `cfg`/`db`/`default`, locked flag, schema) and write with `PATCH /api/v1/settings`. Validation is server-side, returning per-field errors (`422`). Writing a locked key returns `409`. A `null` value resets the key to its default. Writes use optimistic concurrency (version or ETag). Changes apply live where the consumer supports it; otherwise the UI shows "applies after restart of node X". Each save writes `audit_log`.

    | | |
    |---|---|
    | **Entry point** | every Admin settings page |
    | **Gate** | — |
    | **Milestone** | M0 |
