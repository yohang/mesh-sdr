- key: RX-028
  title: '[RX-028] Deep link'
  milestone: M1b
  area: RX
  priority: P2
  effort: 3
  labels:
  - type:feature
  - area:RX
  - priority:P2
  epic: EPIC-M1b-RX
  depends_on:
  - RX-040
  - RX-010
  spec_ref: docs/spec/FEATURE_SPEC.md#67-receiver-core-rx
  body: |-
    ## Summary

    The URL MUST encode node, device and tuning: `/receiver/{nodeId}/{deviceId}?f=<Hz>&m=<mod>&m2=<mod>&sql=<dB>`, updated on tune, mode and squelch changes and re-applied on navigation. Opening a link selects that device for the visitor only. It MUST NOT switch the shared preset or move the center frequency. If `f` lies outside the active preset, a chip says so (and offers a retune to users allowed by RX-010). The URL MUST NOT carry credentials.

    | | |
    |---|---|
    | **Entry point** | address bar, share button (UI-023) |
    | **Gate** | — |
    | **Milestone** | M1b |
    | **Priority** | P2 |
    | **Effort** | 3 story points |

