- key: SRC-021
  title: '[SRC-021] Node-hosted device declaration'
  milestone: M1a
  area: SRC
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:SRC
  - priority:P1
  epic: EPIC-M1a-SRC
  depends_on:
  - GRID-008
  - GRID-016
  spec_ref: docs/spec/FEATURE_SPEC.md#68-sdr-sources--hardware-src
  body: |-
    ## Summary

    Each node MUST declare its devices in its config file under `devices.<id>.*`, with a stable `<id>` unique within the node. On every hub connection the node sends its device list over the control channel. The hub upserts the read-only `devices` registry (id, node, name, type, frequency range, online state, capabilities) keyed by (`node.id`, device id) and addresses each device as `{nodeId}/{deviceId}`. A device removed from config is marked gone, never silently deleted, so that its history (schedules, bookmarks, audit) is kept. The DB stores no device settings.

    | | |
    |---|---|
    | **Entry point** | node config file; control channel |
    | **Gate** | `node.id`, `devices.<id>.*` (cfg) |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | ❌ | 👁 |

    ## Acceptance criteria

    - [ ] Each node MUST declare its devices in its config file under `devices.<id>.*`, with a stable `<id>` unique within the node.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    GRID-008, GRID-016

    ## Spec

    FEATURE_SPEC §6 · [SDR sources & hardware (SRC)]({{SPEC_BASE}}/FEATURE_SPEC.md#68-sdr-sources--hardware-src) — row `SRC-021`.
