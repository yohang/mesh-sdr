- key: AUTH-017
  title: '[AUTH-017] Password storage'
  milestone: M0
  area: AUTH
  priority: P1
  effort: 3
  labels:
  - type:feature
  - area:AUTH
  - priority:P1
  epic: EPIC-M0-AUTH
  depends_on:
  - GRID-001
  spec_ref: docs/spec/FEATURE_SPEC.md#62-authentication-auth
  body: |-
    ## Summary

    Passwords are hashed with **Argon2id**, with a per-user salt and the parameters (`auth.argon2.memory_kib`, `auth.argon2.iterations`, `auth.argon2.parallelism`) from the hub config encoded in the hash string, and compared in constant time. A hash with outdated parameters is rehashed at the next successful login. `users.password_hash` is nullable, for identities that do not use a local password (AUTH-020). A malformed hash makes that one account unusable, never the whole user list.

    | | |
    |---|---|
    | **Entry point** | `users.password_hash` |
    | **Gate** | `auth.argon2.* (cfg)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 3 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | — | — | — | — |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    GRID-001

    ## Spec

    FEATURE_SPEC §6 · [Authentication (AUTH)]({{SPEC_BASE}}/FEATURE_SPEC.md#62-authentication-auth) — row `AUTH-017`.
