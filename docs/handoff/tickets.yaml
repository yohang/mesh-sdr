  - RPT-006
  spec_ref: docs/spec/FEATURE_SPEC.md#619-radiosondes-snd
  body: |-
    ## Summary

    JSON → normalised sonde record (id, position, altitude, course, speed, vertical speed, battery, sats, type, weather, frequency). Non-JSON lines are counted as diagnostic evidence, not displayed. Tracks are stored in `map_features` keyed by serial, spots go to `reporting_outbox` (SondeHub, MQTT). `sonde_url` MUST be delivered to clients.

