- key: DIAG-003
  title: '[DIAG-003] External tool crash / timeout reporting'
  milestone: M1b
  area: DIAG
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:DIAG
  - priority:P1
  epic: EPIC-M1b-DIAG
  depends_on:
  - DEC-048
  spec_ref: docs/spec/FEATURE_SPEC.md#613-decoding-diagnostics-diag
  body: |-
    ## Summary

    The node supervises each decoder process. Non-zero exit, signal, stderr error patterns or spawn failure → `DECODER_ERROR` with exit code and the last stderr lines (admin-only evidence). No output and no progress for the mode's watchdog period, or a file job exceeding its timeout → `TIMEOUT`, and the process is killed. Automatic restart with backoff (max N per window), after which the session stays in `DECODER_ERROR`. Queue overflow (DEC-025) is reported here too.

    | | |
    |---|---|
    | **Entry point** | Automatic (node) |
    | **Gate** | `decoders.watchdog.<mode> (db)`, `decoders.max_restarts (db)` |
    | **Milestone** | M1b |
