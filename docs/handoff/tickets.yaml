    UTC schedule of `HHMM-HHMM → preset`, overnight wrap allowed. Each slot is a `schedules` row `(device_id, preset_id, time window)`, evaluated by the hub. The preset is validated against the device's capabilities when the schedule is saved and again when it is applied; an incompatible preset is refused with a clear error. The hub tells the node to apply the preset and start the device as a background client.

