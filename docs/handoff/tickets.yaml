  depends_on:
  - ADM-022
  spec_ref: docs/spec/FEATURE_SPEC.md#610-bookmarks--scanner-bmk
  body: |-
    ## Summary

    Bookmarks MUST be read from the `bookmarks` table. Pack bookmarks are imported from the packs shipped with the Product: the region pack follows `bandplan.region` and the country pack follows `receiver.country`. Pack rows are read-only. Hub rows are created, edited and deleted by operators and admins. Ids MUST be stable UUIDs. Two bookmarks with the same frequency MUST both be kept.

    | | |
    |---|---|
    | **Entry point** | — (server) |
    | **Gate** | `bandplan.region (db)`, `receiver.country (db)`, `bookmarks.packs_dir (cfg)` |
    | **Milestone** | M1b |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | 👁 | 👁 | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] Bookmarks MUST be read from the `bookmarks` table.
    - [ ] Ids MUST be stable UUIDs.
    - [ ] Two bookmarks with the same frequency MUST both be kept.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    ADM-022

    ## Spec

    FEATURE_SPEC §6 · [Bookmarks & scanner (BMK)]({{SPEC_BASE}}/FEATURE_SPEC.md#610-bookmarks--scanner-bmk) — row `BMK-002`.
