  depends_on:
  - GRID-008
  - GRID-010
  spec_ref: docs/spec/FEATURE_SPEC.md#61-grid-hub-and-nodes-grid
  body: |-
    ## Summary

    At each connection and config reload (SIGHUP or restart), a node reports its device definitions (from its config file, with secrets masked). The hub upserts `devices`, flags devices that are no longer reported as stale (see ADM-009), and disables schedules whose device is stale or whose preset no longer fits the device's capabilities. The registry holds no device settings. A device id that clashes with a different device type is rejected with an error.

