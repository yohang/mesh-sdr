  epic: EPIC-M1a-SRC
  depends_on:
  - SRC-022
  spec_ref: docs/spec/FEATURE_SPEC.md#68-sdr-sources--hardware-src
  body: |-
    ## Summary

    Each node MUST detect which driver types it can run and report them in its capability report (SRC-022). The hub stores them in `node_capabilities`. The admin UI lists the device types available per node. Type resolution MUST use an explicit registry so that every shipped type loads. M1 registers `rtl_sdr`, `rtl_tcp` and basic Soapy; other types are added by SRC-028.

    | | |
    |---|---|
    | **Entry point** | Admin → Nodes → node, `/api/v1/nodes/{id}/capabilities` |
    | **Gate** | `cap:<driver>` |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | ❌ | ✅ |

    ## Acceptance criteria

    - [ ] Each node MUST detect which driver types it can run and report them in its capability report (SRC-022).
    - [ ] Type resolution MUST use an explicit registry so that every shipped type loads.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SRC-022

    ## Spec

    FEATURE_SPEC §6 · [SDR sources & hardware (SRC)]({{SPEC_BASE}}/FEATURE_SPEC.md#68-sdr-sources--hardware-src) — row `SRC-001`.
