    Decide how per-listener DSP chains and the shared per-device FFT are implemented in Go: (a) Go-native DSP (FIR, decimation, demodulators, FFT via a Go FFT library), (b) orchestrating csdr / owrx_connector / nmux processes, (c) cgo bindings to libcsdr (GPLv3: check licence impact). Benchmark on reference hardware (Raspberry Pi 5 class and x86) against the NFRs in TECHNICAL_SPEC §2 and the DSP engine contract in TECHNICAL_SPEC §8.

