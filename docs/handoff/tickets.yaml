milestones:
- key: M0
  title: M0 Foundations
  description: |-
    A running hub and node skeleton that a user can sign in to.

    Exit criteria:
    - `<product> hub|node|all` starts from config files.
    - The DB adapter is in place with SQLite and its migrations.
    - Node enrollment over mTLS works, and the gateway routes to the node.
    - Form login, password reset and invitations work. Roles are enforced.
    - Protocol v1 is in place: envelope, auth at upgrade, error frames.
    - The UI app shell (navigation, responsive layout) is live, with admin look & feel.
    - CI runs the contract tests.

    Spec milestone: M0 (FEATURE_SPEC §5). Features: 77, story points: 300.
- key: M1a
  title: M1a Single-node listening
  description: |-
    Listen to a real SDR on one node from the browser (first half of spec milestone M1).

    Exit criteria:
    - Connector-type SDRs (rtl_sdr, rtl_tcp, basic Soapy) declared in the node config
    - Presets editable and applicable
    - Waterfall and spectrum, AM/SAM/NFM/SSB/CW audio, squelch, NR
    - Listen policy enforced

    Spec milestone: M1 (FEATURE_SPEC §5). Features: 81, story points: 270.
- key: M1b
  title: M1b Multi-node & usability
  description: |-
    Second half of spec milestone M1: grid-aware receiver, bookmarks, basic diagnostics, presence.

    Exit criteria:
    - Multi-node device picker and node-offline behaviour
    - Hub-wide bookmarks and scanner
    - Basic diagnostics (UNAVAILABLE, NO_SIGNAL, DECODER_ERROR) with chips in the UI
    - Presence counts and admin connections view
    - Shortcuts, mobile bottom sheet, deep links

    Spec milestone: M1 (FEATURE_SPEC §5). Features: 50, story points: 152.
- key: M2
  title: M2 Digital modes
  description: |-
    The main digital decoders, each with full diagnostics.

    Exit criteria:
    - WSJT family, JS8, MSK144, packet/APRS decoding, PSK31, RTTY, CW, paging / SelCall / EAS, SSTV, FAX, skimmers and ISM decode on a node.
    - The full diagnostic state machine runs, with hints.
    - The Files gallery shows reception metadata (UTC time, frequency).
    - Browser recording works.

    Spec milestone: M2 (FEATURE_SPEC §5). Features: 73, story points: 322.
- key: M3
  title: M3 Map & tracking
  description: |-
    Everything with a position ends up on a map and in the history.

    Exit criteria:
    - The map shows its layers and locators.
    - The decoded-message history can be browsed and searched.
    - Aviation, marine, sondes and LoRa/Meshtastic are decoded and plotted.

    Spec milestone: M3 (FEATURE_SPEC §5). Features: 48, story points: 182.
- key: M4
  title: M4 Background & reporting
  description: |-
    The receiver works unattended and feeds external networks.

    Exit criteria:
    - Background services and the scheduler run.
    - PSKReporter, WSPRnet, APRS-IS, SondeHub, AIS and MQTT reporting go through the outbox.
    - EIBi, repeater and receiver-directory data are fetched.
    - GPS is used.
    - The metrics API is available.

    Spec milestone: M4 (FEATURE_SPEC §5). Features: 68, story points: 270.
- key: M5
  title: M5 Hardening & scale
  description: |-
    Broad hardware support, migration and production readiness.

    Exit criteria:
    - The remaining SDR types work: full Soapy matrix, sddc, hpsdr, runds, perseus, fifi.
    - The migration tool from OpenWebRX+ installations exists.
    - Performance budgets are met.
    - The PostgreSQL adapter is ready and HA notes are written.

    Spec milestone: M5 (FEATURE_SPEC §5). Features: 7, story points: 76.
- key: M6
