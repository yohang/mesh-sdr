- key: GRID-006
  title: '[GRID-006] Enrollment token'
  milestone: M0
  area: GRID
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:GRID
  - priority:P1
  epic: EPIC-M0-GRID
  depends_on:
  - GRID-007
  spec_ref: docs/spec/FEATURE_SPEC.md#61-grid-hub-and-nodes-grid
  body: |-
    ## Summary

    Enrollment pairs a node with the hub once. The hub creates a single-use, short-lived (`grid.enrollment_ttl_minutes`) enrollment token. The node operator puts it in the node config (`node.enrollment_token`) or passes it to `<product> node enroll`. On first contact, the hub presents the token, the node checks it and returns a CSR, and the hub signs the node certificate from its internal CA. Both sides then pin each other. The token is unusable after success or expiry. Every step is written to `audit_log`.

    | | |
    |---|---|
    | **Entry point** | Admin › Nodes; `<product> node enroll` |
    | **Gate** | `node.enrollment_token (cfg)`, `grid.enrollment_ttl_minutes (db)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | ❌ | ✅ |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    GRID-007

    ## Spec

    FEATURE_SPEC §6 · [Grid: hub and nodes (GRID)]({{SPEC_BASE}}/FEATURE_SPEC.md#61-grid-hub-and-nodes-grid) — row `GRID-006`.
- key: GRID-007
  title: '[GRID-007] mTLS between hub and node'
  milestone: M0
  area: GRID
