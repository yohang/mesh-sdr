- key: AUTH-004
  title: '[AUTH-004] Authorisation'
  milestone: M0
  area: AUTH
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:AUTH
  - priority:P1
  epic: EPIC-M0-AUTH
  depends_on:
  - AUTH-003
  - ACC-006
  spec_ref: docs/spec/FEATURE_SPEC.md#62-authentication-auth
  body: |-
    ## Summary

    Every REST endpoint, every `/api/ws` topic and every node WS message MUST be checked against the caller's roles and the effective listen policy of the target device, server-side. Unauthenticated calls get `401`, forbidden calls get `403` (JSON for the API; the UI redirects to login with a safe `next`). Admin endpoints additionally require the client address to be in `admin.allowed_networks`. Admin users on the receiver page MUST get their admin rights.

    | | |
    |---|---|
    | **Entry point** | all protected routes |
    | **Gate** | `admin.allowed_networks (cfg)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] Every REST endpoint, every `/api/ws` topic and every node WS message MUST be checked against the caller's roles and the effective listen policy of the target device, server-side.
    - [ ] Admin users on the receiver page MUST get their admin rights.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    AUTH-003, ACC-006

    ## Spec

    FEATURE_SPEC §6 · [Authentication (AUTH)]({{SPEC_BASE}}/FEATURE_SPEC.md#62-authentication-auth) — row `AUTH-004`.
