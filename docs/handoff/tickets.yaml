- key: MAP-002
  title: '[MAP-002] Map live feed'
  milestone: M3
  area: MAP
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:MAP
  - priority:P1
  epic: EPIC-M3-MAP
  depends_on:
  - GRID-008
  - ACC-012
  spec_ref: docs/spec/FEATURE_SPEC.md#616-map-map
  body: |-
    ## Summary

    A client subscribes to the `map` topic on `/api/ws`. The hub MUST send a config snapshot, then the current features from `map_features`, then incremental updates. Server-side API keys MUST NOT be sent to clients. Only a key explicitly configured as a browser key (`map.google_browser_key`) is sent, and only when the Google layer is enabled. The subscription MUST honour the global listen policy. Reconnection uses exponential backoff, and the map MUST keep the last state, marked stale, while disconnected.

    | | |
    |---|---|
    | **Entry point** | `/api/ws` topic `map` |
    | **Gate** | `listen_policy (db)` |
    | **Milestone** | M3 |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] The hub MUST send a config snapshot, then the current features from `map_features`, then incremental updates.
    - [ ] Server-side API keys MUST NOT be sent to clients.
    - [ ] The subscription MUST honour the global listen policy.
    - [ ] Reconnection uses exponential backoff, and the map MUST keep the last state, marked stale, while disconnected.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    GRID-008, ACC-012

    ## Spec

    FEATURE_SPEC §6 · [Map (MAP)]({{SPEC_BASE}}/FEATURE_SPEC.md#616-map-map) — row `MAP-002`.
