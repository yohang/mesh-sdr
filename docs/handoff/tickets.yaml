  milestone: M0
  area: ADM
  priority: P3
  effort: 3
  labels:
  - type:feature
  - area:ADM
  - priority:P3
  epic: EPIC-M0-ADM
  depends_on:
  - ADM-002
  spec_ref: docs/spec/FEATURE_SPEC.md#64-administration-adm
  body: |-
    ## Summary

    The avatar (≤ 250 KiB) and panorama (≤ 2 MiB) are uploaded as multipart to `POST /api/v1/branding/{avatar|panorama}`. The server checks size before reading the body, checks the magic bytes, re-encodes the image, and stores it as a `files` row of kind `branding`. "Restore default" deletes the row.

    | | |
    |---|---|
    | **Entry point** | Admin › General › Images |
    | **Gate** | — |
    | **Milestone** | M0 |
    | **Priority** | P3 |
    | **Effort** | 3 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | ❌ | ✅ |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    ADM-002

    ## Spec

    FEATURE_SPEC §6 · [Administration (ADM)]({{SPEC_BASE}}/FEATURE_SPEC.md#64-administration-adm) — row `ADM-004`.
