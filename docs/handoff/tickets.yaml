    Admin › Devices is a **read-only** registry of every device of every node, mirrored from node capability and status reports: node, device id, name, type, frequency range, online state (stopped, starting, tuning, running, failed), capabilities, active preset and listener count. The node-config values `listen_policy` and `operator_can_retune` are shown read-only. Rows of offline nodes appear greyed.

