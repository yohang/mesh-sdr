    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] The URL MUST encode node, device and tuning: `/receiver/{nodeId}/{deviceId}?f=<Hz>&m=<mod>&m2=<mod>&sql=<dB>`, updated on tune, mode and squelch changes and re-applied on navigation.
    - [ ] It MUST NOT switch the shared preset or move the center frequency.
    - [ ] The URL MUST NOT carry credentials.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

