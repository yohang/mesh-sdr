    Design item. Identities are `user_identities` rows (`user_id`, `provider`, `subject`, `created_at`), with `provider = 'local'` for every account in v1 and `subject` the local user id. Login goes through an auth-provider interface (the form login is its only implementation in v1). Sessions and access tokens MUST NOT depend on the login method. `users.password_hash` is nullable. Future OIDC / OAuth2 providers and account linking by verified e-mail are described as future work, not built.

    | | |
    |---|---|
    | **Entry point** | — (server) |
