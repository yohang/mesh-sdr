    | **Entry point** | node config file |
    | **Gate** | `digital_voice_codecserver` (cfg) |
    | **Milestone** | M6 |
    | **Priority** | P4 |
    | **Effort** | 3 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | ❌ | 👁 |

    ## Acceptance criteria

    - [ ] A connection failure MUST produce an `UNAVAILABLE`/`DECODER_ERROR` diagnostic state with a hint such as "codecserver unreachable".
    - [ ] The node MUST also report AMBE availability in its capabilities.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SRC-022, DIAG-001

