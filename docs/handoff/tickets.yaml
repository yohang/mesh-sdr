    The hub performs lookups (rate-limited, with timeout and bounded concurrency) and caches results in `web_caches` with a 24 h TTL, shared by all nodes. Nodes ask the hub over the control channel. Enriched metadata is re-emitted when the lookup completes.

    | | |
    |---|---|
    | **Entry point** | automatic |
    | **Gate** | `digital_voice_dmr_id_lookup`, `digital_voice_nxdn_id_lookup` (cfg\|db) |
    | **Milestone** | M6 |
    | **Priority** | P4 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    GRID-008

    ## Spec

    FEATURE_SPEC §6 · [Digital voice (DV)]({{SPEC_BASE}}/FEATURE_SPEC.md#624-digital-voice-dv) — row `DV-003`.
