- key: UI-009
  title: '[UI-009] Accessibility (WCAG 2.1 AA)'
  milestone: M0
  area: UI
  priority: P1
  effort: 13
  labels:
  - type:feature
  - area:UI
  - priority:P1
  epic: EPIC-M0-UI
  depends_on:
  - UI-008
  spec_ref: docs/spec/FEATURE_SPEC.md#65-ui-shell--customisation-ui
  body: |-
    ## Summary

    Every page MUST meet WCAG 2.1 AA. In particular: all controls reachable and operable by keyboard with visible focus; landmarks and headings; labelled inputs; contrast ≥ 4.5:1 for text and ≥ 3:1 for UI parts; color never the only cue; content usable at 200 % zoom. Canvases get text equivalents: tuned frequency, mode and signal level as text, and decodes in an accessible list. Status changes go to throttled `aria-live` regions.

    | | |
    |---|---|
    | **Entry point** | all pages |
    | **Gate** | — |
    | **Milestone** | M0 |
    | **Priority** | P1 |
