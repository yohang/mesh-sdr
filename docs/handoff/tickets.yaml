    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ⚙️ `session_timeout` | ⚙️ `session_timeout` | ⚙️ `session_timeout` | ⚙️ `session_timeout` |

    ## Acceptance criteria

    - [ ] The node MUST close a listener's media WS after `session_timeout` seconds of connection, applying it per role (anonymous and listener by default; operators and admins exempt unless configured).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

