  spec_ref: docs/spec/FEATURE_SPEC.md#613-decoding-diagnostics-diag
  body: |-
    ## Summary

    A decoder whose `cap:<flag>` is missing on the node is listed with state `UNAVAILABLE` and reason `capability_missing:<flag>` (tool, required version, found version). Non-admins see "not available on this receiver". Admins see the missing tool and the probe output. A capability that disappears at runtime (tool removed or failing self-test) moves running sessions to `DECODER_ERROR`.

    | | |
    |---|---|
    | **Entry point** | Decoders tab; Admin → Nodes → Capabilities |
    | **Gate** | `cap:<flag>` |
    | **Milestone** | M1b |
    | **Priority** | P1 |
    | **Effort** | 3 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | 👁 | 👁 | 👁 | ✅ |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    DEC-001

    ## Spec

    FEATURE_SPEC §6 · [Decoding diagnostics (DIAG)]({{SPEC_BASE}}/FEATURE_SPEC.md#613-decoding-diagnostics-diag) — row `DIAG-004`.
- key: DIAG-005
  title: '[DIAG-005] Signal presence baseline'
  milestone: M1b
  area: DIAG
  priority: P1
  effort: 5
  labels:
