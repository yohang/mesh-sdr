  body: |-
    ## Summary

    All hub↔node traffic (control channel, gateway-proxied WS, API calls) MUST use mutual TLS with the hub CA (`tls.*`), TLS 1.2 or later, with certificate rotation before expiry and revocation on node removal. A node MUST refuse non-mTLS connections, except browser WS connections that arrive through the gateway carrying a valid access token.

    | | |
    |---|---|
    | **Entry point** | — |
    | **Gate** | `tls.* (cfg)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | — | — | — | — |

    ## Acceptance criteria

    - [ ] All hub↔node traffic (control channel, gateway-proxied WS, API calls) MUST use mutual TLS with the hub CA (`tls.*`), TLS 1.2 or later, with certificate rotation before expiry and revocation on node removal.
    - [ ] A node MUST refuse non-mTLS connections, except browser WS connections that arrive through the gateway carrying a valid access token.
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

