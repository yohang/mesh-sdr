- key: RX-006
  title: '[RX-006] Preset select (shared)'
  milestone: M1a
  area: RX
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:RX
  - priority:P1
  epic: EPIC-M1a-RX
  depends_on:
  - SRC-006
  - SRC-007
  - UI-012
  spec_ref: docs/spec/FEATURE_SPEC.md#67-receiver-core-rx
  body: |-
    ## Summary

    Every user sees the active preset of the device. The selector lists only presets compatible with the device (frequency range, supported sample rates). Only an operator (on a device with `operator_can_retune`) or an admin may switch it, via WS `select_preset`. The node MUST check the token role and the device flag, and MUST reject a disallowed request with an explicit error. An incompatible preset MUST be refused at apply time with a clear error. The UI hides or disables the control for others. A switch is recorded in `audit_log` and announced to all listeners of the device (UI-011). The node MUST rate-limit preset switches per connection.

    | | |
    |---|---|
    | **Entry point** | control bar preset selector, shortcut `P` |
    | **Gate** | `devices.<id>.operator_can_retune` (cfg) |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | 👁 | 👁 | ⚙️ `devices.<id>.operator_can_retune` | ✅ |

    ## Acceptance criteria

    - [ ] The node MUST check the token role and the device flag, and MUST reject a disallowed request with an explicit error.
    - [ ] An incompatible preset MUST be refused at apply time with a clear error.
    - [ ] The node MUST rate-limit preset switches per connection.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SRC-006, SRC-007, UI-012

    ## Spec

    FEATURE_SPEC §6 · [Receiver core (RX)]({{SPEC_BASE}}/FEATURE_SPEC.md#67-receiver-core-rx) — row `RX-006`.
