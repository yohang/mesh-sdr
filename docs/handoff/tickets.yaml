    Three layouts. **Desktop** (≥ 1200 px): side panel docked on the right, control bar under the waterfall. **Tablet** (768–1199 px): side panel collapsible and closed by default, control bar wraps into two rows. **Mobile** (< 768 px): side panel becomes a bottom sheet (UI-020), with a compact control bar and secondary controls in an overflow sheet. No horizontal page scroll at 320 px width. Touch targets at least 44×44 px. Layouts MUST follow orientation changes.

    | | |
    |---|---|
    | **Entry point** | all pages |
    | **Gate** | — |
    | **Milestone** | M0 |
    | **Priority** | P1 |
