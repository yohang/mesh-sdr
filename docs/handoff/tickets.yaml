- key: ADM-017
  title: '[ADM-017] Edit preset'
  milestone: M1a
  area: ADM
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:ADM
  - priority:P1
  epic: EPIC-M1a-ADM
  depends_on:
  - GRID-010
  spec_ref: docs/spec/FEATURE_SPEC.md#64-administration-adm
  body: |-
    ## Summary

    Presets are `presets` rows on the hub DB, **independent of any device or node** (no `device_id` or `node_id`). Fields: `name`, `center_freq`, `samp_rate`, `start_freq`, `start_mod`, `tuning_step`, initial squelch and NR level, waterfall levels, and an optional description and tags. Field syntax is validated on save. Compatibility with a device (frequency range, supported sample rates) is checked **at apply time** against that device's reported capabilities: incompatible presets are hidden from that device's selectors, or refused with a clear error. Hardware settings are never preset fields. Unknown ids return 404.

    | | |
    |---|---|
    | **Entry point** | Admin › Presets › {preset} |
    | **Gate** | — |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

