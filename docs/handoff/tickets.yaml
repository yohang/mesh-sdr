- key: SVC-022
  title: '[SVC-022] Hub-computed service plan'
  milestone: M4
  area: SVC
  priority: P1
  effort: 13
  labels:
  - type:feature
  - area:SVC
  - priority:P1
  epic: EPIC-M4-SVC
  depends_on:
  - SVC-002
  spec_ref: docs/spec/FEATURE_SPEC.md#621-background-services--scheduler-svc
  body: |-
    ## Summary

    The hub derives a versioned service plan per node from `settings`, `devices`, `presets`, `schedules` and `node_capabilities`, and pushes it over the control channel. The node acknowledges and reports per-chain status. When the hub is unreachable, the node keeps running the last acknowledged plan in RAM and buffers events in a bounded queue until reconnect (no persistent node state).

    | | |
    |---|---|
    | **Entry point** | Automatic; Admin → Background services |
    | **Gate** | – |
    | **Milestone** | M4 |
    | **Priority** | P1 |
    | **Effort** | 13 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | 👁 | ✅ |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SVC-002

    ## Spec

    FEATURE_SPEC §6 · [Background services & scheduler (SVC)]({{SPEC_BASE}}/FEATURE_SPEC.md#621-background-services--scheduler-svc) — row `SVC-022`.
- key: RPT-001
