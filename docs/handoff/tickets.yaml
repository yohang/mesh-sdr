- key: ACC-002
  title: '[ACC-002] Invitations'
  milestone: M0
  area: ACC
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:ACC
  - priority:P1
  epic: EPIC-M0-ACC
  depends_on:
  - ACC-006
  - ACC-011
  spec_ref: docs/spec/FEATURE_SPEC.md#63-accounts--access-acc
  body: |-
    ## Summary

    Invitations are the only way to create an account from the web UI. An admin creates an `invitations` row with an optional e-mail, a pre-set role, an expiry (`invitations.ttl_hours`) and a single use. The invitation is sent by e-mail when an e-mail is given and SMTP is configured, or shown as a copyable link. The invitee opens the link, chooses a user name (unless pre-set) and a password that follows ACC-011, and the account is created with the pre-set role. Accepting an e-mailed invitation marks that e-mail as verified. Invitations can be listed and revoked. Creation, acceptance and revocation write `audit_log`.

    | | |
    |---|---|
    | **Entry point** | Admin › Invitations; `/invite/{token}` |
    | **Gate** | `invitations.ttl_hours (db)`, `smtp.* (cfg)` |
    | **Milestone** | M0 |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ✅ (with valid token) | — | — | ✅ |

    ## Acceptance criteria

    - [ ] Behaves as described in the Summary.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    ACC-006, ACC-011

    ## Spec

    FEATURE_SPEC §6 · [Accounts & access (ACC)]({{SPEC_BASE}}/FEATURE_SPEC.md#63-accounts--access-acc) — row `ACC-002`.
- key: ACC-003
