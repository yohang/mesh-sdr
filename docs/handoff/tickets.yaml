- key: SRC-004
  title: '[SRC-004] Start retry & failure'
  milestone: M1a
  area: SRC
  priority: P1
  effort: 5
  labels:
  - type:feature
  - area:SRC
  - priority:P1
  epic: EPIC-M1a-SRC
  depends_on:
  - SRC-025
  spec_ref: docs/spec/FEATURE_SPEC.md#68-sdr-sources--hardware-src
  body: |-
    ## Summary

    The node MUST retry a failed device start every 15 s, up to 10 attempts, then mark the device `failed`. The node MUST report each transition, including `starting`, to the hub. The hub persists the state in `devices` and writes failures to `audit_log`. An admin MAY reset a failed device through the API without restarting the node.

    | | |
    |---|---|
    | **Entry point** | automatic; `POST /api/v1/devices/{id}/reset` |
    | **Gate** | — |
    | **Milestone** | M1a |
    | **Priority** | P1 |
    | **Effort** | 5 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | ❌ | ❌ | 👁 | ✅ |

    ## Acceptance criteria

    - [ ] The node MUST retry a failed device start every 15 s, up to 10 attempts, then mark the device `failed`.
    - [ ] The node MUST report each transition, including `starting`, to the hub.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    SRC-025

    ## Spec

    FEATURE_SPEC §6 · [SDR sources & hardware (SRC)]({{SPEC_BASE}}/FEATURE_SPEC.md#68-sdr-sources--hardware-src) — row `SRC-004`.
