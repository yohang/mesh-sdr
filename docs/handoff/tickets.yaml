- key: EPIC-M1a-DEM
  title: '[Epic] Analog demodulation — M1a Single-node listening'
  milestone: M1a
  area: DEM
  labels:
  - type:epic
  - area:DEM
  effort_total: 33
  children:
  - DEM-001
  - DEM-002
