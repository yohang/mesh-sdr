  depends_on:
  - DEC-047
  spec_ref: docs/spec/FEATURE_SPEC.md#622-reporting--spotting-rpt
  body: |-
    ## Summary

    Spots are written to `reporting_outbox` (reporter, payload, status, attempts, next attempt, last error). Each enabled reporter has a worker that delivers at-least-once with exponential backoff and a per-reporter batch policy. Failed and delivered rows are purged by retention. Mode filtering per reporter. Reporters reload when their settings change.

