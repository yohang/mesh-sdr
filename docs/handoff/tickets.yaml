- key: EPIC-M0-GRID
  title: '[Epic] Grid: hub and nodes — M0 Foundations'
  milestone: M0
  area: GRID
  labels:
  - type:epic
  - area:GRID
  effort_total: 117
  children:
  - GRID-001
  - GRID-002
