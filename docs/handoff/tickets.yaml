    - [ ] It MUST NOT change the center frequency or the preset.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    RX-023, BMK-001

