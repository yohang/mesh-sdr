- key: DIAG-010
  title: '[DIAG-010] Wrong-protocol heuristic'
  milestone: M2
  area: DIAG
  priority: P3
  effort: 8
  labels:
  - type:feature
  - area:DIAG
  - priority:P3
  epic: EPIC-M2-DIAG
  depends_on:
  - DIAG-001
  spec_ref: docs/spec/FEATURE_SPEC.md#613-decoding-diagnostics-diag
  body: |-
    ## Summary

    When there is signal but no sync or decode, the node compares the measured occupied bandwidth, tone spacing, symbol rate estimate and burst timing with a signature table of the supported modes. A good match for another mode raises `WRONG_PROTOCOL_SUSPECTED` with `suggested_mode`, always `confidence=heuristic`. The client MAY offer a one-click switch to that mode, subject to the allow-list. The heuristic MUST be disableable per mode.

    | | |
    |---|---|
    | **Entry point** | Automatic (node); Decoders tab |
    | **Gate** | `diagnostics.wrong_protocol (db)` |
    | **Milestone** | M2 |
    | **Priority** | P3 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | LP | ✅ | ✅ | ✅ |

    ## Acceptance criteria

    - [ ] The heuristic MUST be disableable per mode.
    - [ ] Rights are enforced server-side exactly as in the Rights table (tests cover each role).
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    DIAG-001

    ## Spec

    FEATURE_SPEC §6 · [Decoding diagnostics (DIAG)]({{SPEC_BASE}}/FEATURE_SPEC.md#613-decoding-diagnostics-diag) — row `DIAG-010`.
