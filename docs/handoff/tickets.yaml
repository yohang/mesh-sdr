- key: EPIC-M0-AUTH
  title: '[Epic] Authentication — M0 Foundations'
  milestone: M0
  area: AUTH
  labels:
  - type:epic
  - area:AUTH
  effort_total: 54
  children:
  - AUTH-001
  - AUTH-002
  - AUTH-003
