- key: DIAG-001
  title: '[DIAG-001] Diagnostic state machine per decoder session'
  milestone: M1b
  area: DIAG
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:DIAG
  - priority:P1
  epic: EPIC-M1b-DIAG
  depends_on:
  - DEC-002
  spec_ref: docs/spec/FEATURE_SPEC.md#613-decoding-diagnostics-diag
  body: |-
    ## Summary

    Each decoder session MUST hold exactly one state from `UNAVAILABLE`, `IDLE`, `NO_SIGNAL`, `SIGNAL_NO_SYNC`, `SYNC_NO_DECODE`, `DECODING`, `WRONG_PROTOCOL_SUSPECTED`, `DECODER_ERROR`, `TIMEOUT`, with a machine-readable `reason`, a `hint` id (DIAG-006), `confidence` (`counters` | `heuristic`) and the evidence values. States are evaluated over a sliding window sized per mode (for example one slot for WSJT). Hysteresis prevents flapping. `DECODING` is entered on the first valid decode and left after a quiet window. Transitions are timestamped.

    | | |
    |---|---|
    | **Entry point** | Automatic (node) |
    | **Gate** | `diagnostics.window.<mode> (db)` |
    | **Milestone** | M1b |
    | **Priority** | P1 |
    | **Effort** | 8 story points |

    ## Rights

    | Anonymous | Listener | Operator | Admin |
    |---|---|---|---|
    | – | – | – | – |

    ## Acceptance criteria

    - [ ] Each decoder session MUST hold exactly one state from `UNAVAILABLE`, `IDLE`, `NO_SIGNAL`, `SIGNAL_NO_SYNC`, `SYNC_NO_DECODE`, `DECODING`, `WRONG_PROTOCOL_SUSPECTED`, `DECODER_ERROR`, `TIMEOUT`, with a machine-readable `reason`, a `hint` id (DIAG-006), `confidence` (`counters` | `heuristic`) and the evidence values.
    - [ ] Automated tests cover the behaviour (unit and, where relevant, integration).

    ## Depends on

    DEC-002

    ## Spec

    FEATURE_SPEC §6 · [Decoding diagnostics (DIAG)]({{SPEC_BASE}}/FEATURE_SPEC.md#613-decoding-diagnostics-diag) — row `DIAG-001`.
