- key: DEC-002
  title: '[DEC-002] Secondary demodulator framework'
  milestone: M2
  area: DEC
  priority: P1
  effort: 13
  labels:
  - type:feature
  - area:DEC
  - priority:P1
  epic: EPIC-M2-DEC
  depends_on:
  - DIAG-001
  - DEC-001
  spec_ref: docs/spec/FEATURE_SPEC.md#612-data-decoders-dec
  body: |-
    ## Summary

    A digital mode is a primary (underlying) demodulator plus a decoder chain on the node. The decoder reads the complex selector output, the primary's audio, or its own narrow secondary selector. Output MUST be **typed JSON events only** (no serialised language objects), sent over WS `rx.v1` and forwarded to the hub. The node MUST check every `decoder.start` request against the mode catalogue, `cap:<flag>` and the service-only flag (the derived allow-list, no extra key), and reply with an error otherwise. Each session MUST create a DIAG-001 state machine.

    | | |
    |---|---|
    | **Entry point** | Receiver → Decoders tab; WS `rx.v1` `decoder.start` |
    | **Gate** | `cap:<flag>` |
    | **Milestone** | M2 |
    | **Priority** | P1 |
