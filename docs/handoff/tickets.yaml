- key: SVC-005
  title: '[SVC-005] Service placement from bandplan'
  milestone: M4
  area: SVC
  priority: P1
  effort: 8
  labels:
  - type:feature
  - area:SVC
  - priority:P1
  epic: EPIC-M4-SVC
  depends_on:
