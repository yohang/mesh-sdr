name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Nightly accessibility check (job a11y).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Runner UID/GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: dev
          load: true
          tags: mesh-sdr-dev:ci
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Generate
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci go generate ./...

      - name: Lint
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci golangci-lint run

      - name: Test
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci go test ./...

      # The cgo DSP, the device runtime and the media send queue run
      # concurrent goroutines over shared rings (ADR 0019); the gateway
      # proxies media WebSockets (ADR 0021).
      - name: Test (race)
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci go test -race ./internal/dsp/... ./internal/radio/... ./internal/protocol/rxv1/sendq/... ./internal/protocol/rxv1/wsconn/... ./internal/grid/infra/media/... ./internal/grid/infra/gateway/...

  # Nightly and on demand only (ADR 0021): not on pushes nor pull requests.
  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The production image of the hub (theme mode auto), migrated, checked
      # by the CI-only axe-core container (.infra/a11y). Node never enters
      # the app images.
      - name: Start the hub
        run: docker compose -f .infra/a11y/compose.yaml up -d --build --wait hub

      - name: Check accessibility
        run: docker compose -f .infra/a11y/compose.yaml run --rm --build --no-deps a11y

      - name: Hub logs
        if: failure()
        run: docker compose -f .infra/a11y/compose.yaml logs migrate hub

      - name: Stop the hubs
        if: always()
        run: docker compose -f .infra/a11y/compose.yaml down -v

  # Pushes to main and tags only (not pull requests).
  image:
    name: Production image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          # meshsdr: one image for every role (CMD all; `node` for a node).
          - target: prod
            suffix: ""
          # Corresponding sources of the bundled GPL components (§8.7).
          - target: sources
            suffix: "-sources"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # arm64 images are built under QEMU (ADR 0019).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  config-schema:
    name: Publish config JSON Schemas
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Runner UID/GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: dev
          load: true
          tags: mesh-sdr-dev:ci
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=dev

      - name: Generate schemas
        run: |
          docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci bash -c \
            'go generate ./... && go run ./cmd/meshsdr hub config schema > hub.schema.json && go run ./cmd/meshsdr node config schema > node.schema.json'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" hub.schema.json node.schema.json --clobber
