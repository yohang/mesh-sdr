name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Runner UID/GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: dev
          load: true
          tags: mesh-sdr-dev:ci
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Generate
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci go generate ./...

      - name: Lint
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci golangci-lint run

      - name: Lint (nogateway)
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci golangci-lint run --build-tags nogateway

      - name: Test
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci go test ./...

      # The cgo DSP, the device runtime and the media send queue run
      # concurrent goroutines over shared rings (ADR 0019).
      - name: Test (race)
        run: docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci go test -race ./internal/dsp/... ./internal/radio/... ./internal/protocol/rxv1/sendq/...

      # The node-only build (ADR 0012) must not link Caddy.
      - name: Test (nogateway)
        run: |
          docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci sh -c '
            go test -tags nogateway ./... &&
            if go list -deps -tags nogateway ./cmd/meshsdr | grep -q caddyserver; then
              echo "the nogateway build links Caddy" >&2; exit 1
            fi'

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The production image of the hub, migrated, checked by the CI-only
      # axe-core container (.infra/a11y). Node never enters the app images.
      - name: Start the hubs (theme modes auto, light, dark)
        run: docker compose -f .infra/a11y/compose.yaml up -d --build --wait hub-auto hub-light hub-dark

      - name: Check accessibility
        run: docker compose -f .infra/a11y/compose.yaml run --rm --build --no-deps a11y

      - name: Hub logs
        if: failure()
        run: docker compose -f .infra/a11y/compose.yaml logs migrate hub-auto hub-light hub-dark

      - name: Stop the hubs
        if: always()
        run: docker compose -f .infra/a11y/compose.yaml down -v

  image:
    name: Production image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        include:
          # meshsdr: hub, node and all, with the embedded gateway.
          - target: prod
            suffix: ""
          # meshsdr-node: node only, built with -tags nogateway.
          - target: prod-node
            suffix: "-node"
          # Corresponding sources of the bundled GPL components (§8.7).
          - target: sources
            suffix: "-sources"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # arm64 images are built under QEMU on main and tags only; pull
      # requests build amd64 (ADR 0019).
      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  config-schema:
    name: Publish config JSON Schemas
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Runner UID/GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/Dockerfile
          target: dev
          load: true
          tags: mesh-sdr-dev:ci
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=dev

      - name: Generate schemas
        run: |
          docker run --rm -v "$PWD:/app" mesh-sdr-dev:ci bash -c \
            'go generate ./... && go run ./cmd/meshsdr hub config schema > hub.schema.json && go run ./cmd/meshsdr node config schema > node.schema.json'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" hub.schema.json node.schema.json --clobber
